<div class="app">
  <header class="top">
    <div class="brand"><h1 id="brandT">生態瓶實驗室</h1><small id="brandS">ECO JAR LAB</small></div>
    <div class="jars" id="jarSeg" role="group" aria-label="Jars"></div>
    <div class="seg mode" id="modeSeg" role="group" aria-label="Mode"></div>
    <div class="clock"><b id="clkDay"></b><b id="clkTime"></b><span id="lightTag" class="tag"></span></div>
    <div class="ctrls">
      <div class="grp"><button class="btn primary" id="playBtn"></button><div class="seg" id="speedSeg" role="group" aria-label="Speed"></div></div>
      <div class="grp"><button class="btn" id="feedBtn"></button><button class="btn magic" id="balBtn"></button></div>
      <div class="grp"><button class="btn" id="presetBtn"></button><button class="btn build" id="buildHdr"></button></div>
      <div class="grp"><button class="btn" id="shareBtn"></button><button class="btn lang" id="langBtn"></button></div>
    </div>
  </header>
  <div class="main">
    <section class="stage" id="stage">
      <canvas id="c"></canvas>
      <div class="hud"><div class="hud-l"><button class="pill click" id="status" aria-haspopup="dialog"><i></i><span></span></button><div class="pill wx" id="wxPill"></div><button class="tglbtn" id="dnBtn"></button></div>
        <div class="hud-r"><div class="hud-rr"><button class="clearbtn" id="clearBtn"></button></div><span class="hint" id="hint"></span></div></div>
      <div class="ov ovL" id="ovL" hidden><div class="ovhead"><h4 id="ovLT"></h4><button class="x" id="ovLX" aria-label="Close">×</button></div><div class="ovbody" id="pane-bal"></div></div><div class="ov ovR" id="ovR" hidden></div>
      <button class="edge edgeL" id="edgeL"></button><button class="edge edgeR" id="edgeR"></button>
      <div class="cambar" id="camBar" hidden></div>
      <div class="pop" id="pop" hidden></div><div class="pop issues" id="issuePop" hidden></div>
      <div class="meters" id="meters"></div>
      <div class="buildbar" id="buildBar" hidden></div>
    </section>
    <aside class="panel">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="add" aria-selected="true"></button>
        <button role="tab" data-tab="jar" aria-selected="false"></button>
        <button role="tab" data-tab="env" aria-selected="false"></button>
        <button role="tab" data-tab="ana" aria-selected="false"></button>
        <button role="tab" data-tab="play" aria-selected="false"></button>
      </nav>
      <div class="pane" id="pane-add"></div>
      <div class="pane" id="pane-jar" hidden></div>
      <div class="pane" id="pane-env" hidden></div>
      <div class="pane" id="pane-ana" hidden></div>
      <div class="pane" id="pane-play" hidden></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>
<dialog class="dlg" id="dlg"></dialog>
