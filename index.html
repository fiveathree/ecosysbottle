<title>生態瓶實驗室</title>

<style>
/* Layout: one-screen lab bench — live 3D jar on the left, specimen sheet (catalog / contents / budget / environment) on the right; stacks on phones */
:root{
  --bg:#edf3f2; --surface:#ffffff; --surface-2:#f4f8f7; --ink:#10262b; --muted:#566f74; --line:#d3dfde;
  --accent:#0f716b; --accent-soft:#d7ebe8; --on-accent:#ffffff;
  --leaf:#4a8628; --o2:#2672ad; --warn:#a4660f; --bad:#bf3828; --good:#2b7f52;
  --glass:rgba(255,255,255,.82);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1517; --surface:#112022; --surface-2:#0e1b1d; --ink:#e1eeec; --muted:#8fa8a7; --line:#223739;
  --accent:#46b8ac; --accent-soft:#163533; --on-accent:#05211e;
  --leaf:#8cc152; --o2:#6db3e8; --warn:#e2a84c; --bad:#f06c5c; --good:#5cc28b;
  --glass:rgba(12,24,26,.8); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1517; --surface:#112022; --surface-2:#0e1b1d; --ink:#e1eeec; --muted:#8fa8a7; --line:#223739;
  --accent:#46b8ac; --accent-soft:#163533; --on-accent:#05211e;
  --leaf:#8cc152; --o2:#6db3e8; --warn:#e2a84c; --bad:#f06c5c; --good:#5cc28b;
  --glass:rgba(12,24,26,.8); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;flex-direction:column;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.08em}
.clock{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;margin-right:auto;flex-wrap:wrap}
.clock b{font-weight:500;font-size:15px}
.tag{font-family:var(--f-body);font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.tag.day{color:var(--warn)} .tag.night{color:var(--o2)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.magic{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.danger{color:var(--bad)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.seg.mode button{font-size:13px;padding:6px 14px}

.main{display:flex;flex-direction:column;gap:12px}
.stage{position:relative;height:56vh;min-height:320px;border-radius:14px;overflow:hidden;background:#0f1d22;border:1px solid var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hud-l{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);display:flex;gap:6px;align-items:center;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.pill.warn i{background:var(--warn)} .pill.bad i{background:var(--bad)}
.pill.wx{font-weight:500}
.hint{font-size:11px;color:var(--muted);background:var(--glass);padding:3px 9px;border-radius:99px;border:1px solid var(--line)}
.meters{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px;pointer-events:none}
.meter{background:var(--glass);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:5px 9px;min-width:0}
.meter .l{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500}
.meter .v small{font-size:10px;color:var(--muted);margin-left:2px}
.meter .bar{height:3px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden}
.meter .bar span{display:block;height:100%;background:var(--good)}
.meter.warn .v{color:var(--warn)} .meter.warn .bar span{background:var(--warn)}
.meter.bad .v{color:var(--bad)} .meter.bad .bar span{background:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 10px 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.pane{padding:14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0}
.pane h2{font-family:var(--f-display);font-size:16px;margin:0}
.pane h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.lede{color:var(--muted);font-size:12.5px;margin:0}

.cards{display:grid;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;background:var(--surface-2)}
.card .nm{font-weight:700;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.card .nm em{font-weight:400;font-size:11px;color:var(--muted)}
.card p{margin:0;font-size:12.5px;color:var(--muted);grid-column:1/2}
.ctr{grid-row:1/3;grid-column:2;align-self:center;display:flex;align-items:center;gap:4px}
.ctr button{width:34px;height:34px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-size:18px;line-height:1}
.ctr button.minus{background:var(--surface);color:var(--accent)}
.ctr button:disabled{opacity:.35;cursor:default}
.ctr output{min-width:22px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:4px;grid-column:1/-1}
.chip{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) 80px;align-items:center;gap:10px;padding:8px 12px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--accent-soft)}
.row .t{display:flex;flex-direction:column;min-width:0}
.row .t span{font-size:11.5px;color:var(--muted)}
.row .t span.warn{color:var(--warn)} .row .t span.bad{color:var(--bad)}
.hbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.hbar span{display:block;height:100%;background:var(--good)}
.hbar.warn span{background:var(--warn)} .hbar.bad span{background:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:13px;text-align:center}

.editor{border:1px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.ed-head{display:flex;align-items:center;gap:8px}
.ed-head h2{margin-right:auto}
.x{border:0;background:none;font-size:18px;color:var(--muted);width:30px;height:30px;border-radius:6px}
.vitals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vital{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.vital b{color:var(--ink);font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.param{display:flex;flex-direction:column;gap:3px}
.param .ph{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.param .ph output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.param small{color:var(--muted);font-size:11.5px}
input[type=range]{width:100%;accent-color:var(--accent)}
.ed-actions{display:flex;flex-wrap:wrap;gap:8px}

.budget{display:flex;flex-direction:column;gap:10px}
.bud{display:flex;flex-direction:column;gap:5px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.bud .bh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bud .bh b{font-size:13px}
.bud .bh span{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:52px minmax(0,1fr) 84px;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.pair .track{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.pair .track span{display:block;height:100%}
.pair .track i{position:absolute;top:-2px;bottom:-2px;width:3px;border-radius:2px;background:var(--ink)}
.pair .n{font-family:var(--f-mono);text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.bud p{margin:0;font-size:12.5px}
.bud.good{border-left:4px solid var(--good)} .bud.warn{border-left:4px solid var(--warn)} .bud.bad{border-left:4px solid var(--bad)}
.verdict{padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.verdict b{font-family:var(--f-display);font-size:16px;display:block}
.report{border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:13px}
.report ul{margin:6px 0 0;padding-left:18px}
.chartbox{border:1px solid var(--line);border-radius:10px;padding:10px}
.chartbox canvas{width:100%;height:170px;display:block}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.log{list-style:none;margin:0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.log li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}
.log .tm{font-family:var(--f-mono);color:var(--muted);font-size:11.5px}

.field{display:flex;flex-direction:column;gap:4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.switch input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.presets{display:grid;gap:8px}
.preset{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.preset:hover{border-color:var(--accent)}
.preset b{display:block}
.preset span{font-size:12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;margin-top:6px}
.opt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:12px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.opt svg{width:32px;height:40px;fill:color-mix(in srgb,var(--o2) 18%,transparent);stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.opt .sw{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:block;margin:4px 0}
.opt em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:400;font-family:var(--f-mono)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1}

@media (min-width:920px){
  html,body{overflow:hidden}
  .app{height:100%;padding-block:14px}
  .main{flex-direction:row;flex:1;min-height:0}
  .stage{flex:1;height:auto;min-width:0}
  .panel{width:410px;flex:none}
  .pane{flex:1}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>生態瓶實驗室</h1><small>ECOSYSTEM BENCH</small></div>
    <div class="seg mode" id="modeSeg" role="group" aria-label="模式"></div>
    <div class="clock"><b id="clkDay">第 1 日</b><b id="clkTime">06:00</b><span id="lightTag" class="tag night">熄燈</span></div>
    <div class="ctrls">
      <button class="btn primary" id="playBtn">暫停</button>
      <div class="seg" id="speedSeg" role="group" aria-label="模擬速度"></div>
      <button class="btn" id="feedBtn">即刻餵食</button>
      <button class="btn magic" id="balBtn">一鍵平衡</button>
    </div>
  </header>
  <div class="main">
    <section class="stage" id="stage">
      <canvas id="c" aria-label="3D 生態瓶，拖動旋轉，撳生物睇參數"></canvas>
      <div class="hud"><div class="hud-l"><div class="pill" id="status"><i></i><span>穩定</span></div><div class="pill wx" id="wxPill">晴天</div></div><span class="hint">拖動旋轉 · 撳生物睇參數</span></div>
      <div class="meters" id="meters"></div>
    </section>
    <aside class="panel">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="add" aria-selected="true">加入</button>
        <button role="tab" data-tab="jar" aria-selected="false" id="tabJarBtn">瓶內</button>
        <button role="tab" data-tab="bal" aria-selected="false">平衡分析</button>
        <button role="tab" data-tab="env" aria-selected="false">環境同天氣</button>
      </nav>
      <div class="pane" id="pane-add"></div>
      <div class="pane" id="pane-jar" hidden></div>
      <div class="pane" id="pane-bal" hidden></div>
      <div class="pane" id="pane-env" hidden></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fx=(x,d=1)=>(Math.abs(x)<1e-9?0:x).toFixed(d);
const rnd=(a,b)=>a+Math.random()*(b-a);
const P=(l,u,min,max,step,h)=>({l,u,min,max,step,h:h||''});

/* ================= 參數定義 ================= */
const AN_COMMON={
  food:P('每日食量','份/日',0,3,.1,'1 份 ≈ 一撮飼料；冇得食會慢慢餓'),
  wasteEvery:P('幾耐去一次廁所','小時',1,48,1,'排泄嘅時間間隔'),
  tMin:P('最低溫度','°C',0,35,1,'低過呢個溫度會凍親'),
  tMax:P('最高溫度','°C',5,40,1,'高過呢個溫度會熱親')};
const DEFS={
  aplant:{o2Prod:P('光照時產氧','mg/小時',0,3,.05,'開燈時每小時製造幾多氧氣'),resp:P('呼吸耗氧','mg/小時',0,.5,.01,'日夜都要呼吸，夜晚只用氧唔產氧'),uptake:P('吸收養分','mg/小時',0,.05,.001,'吸收氨同硝酸鹽，即係動物排泄物分解出嚟嘅嘢')},
  aanimal:{resp:P('呼吸耗氧','mg/小時',0,.5,.005,'25°C 時每小時用幾多氧；水越暖用得越多'),food:AN_COMMON.food,wasteEvery:AN_COMMON.wasteEvery,
    wasteAmt:P('每次排泄量','mg 氨',0,.3,.005,'一半即刻變氨，一半變殘渣慢慢分解'),o2Min:P('最少要幾多氧','mg/L',.5,8,.1,'溶氧低過呢個數就會缺氧'),
    nh3Tol:P('氨耐受上限','mg/L',.05,2,.05,'氨濃度高過呢個數就會中毒'),tMin:AN_COMMON.tMin,tMax:AN_COMMON.tMax},
  nitri:{cap:P('分解氨能力','mg/小時',0,.15,.005,'每小時最多將幾多氨變成硝酸鹽；底沙同石頭越多，細菌住得越多'),o2PerN:P('分解耗氧','mg 氧/mg 氨',0,6,.1,'每分解 1 mg 氨要用幾多氧')},
  decomp:{rate:P('分解殘渣','份/小時',0,.5,.01,'加快分解飼料殘渣同屍體，分解出嚟嘅氨要靠硝化菌處理'),o2Per:P('分解耗氧','mg/份',0,2,.05,'')},
  rplant:{o2Prod:P('光照時產氧','mg/小時',0,5,.1,'開燈時每小時製造幾多氧氣，同時食走二氧化碳'),resp:P('呼吸耗氧','mg/小時',0,1,.01,''),

function envInfo(st){
  const E={sub:0,subTypes:{},rocks:0,pool:null,poolSize:0};
  for(const it of st.items){if(!it.alive)continue;const c=CAT[it.type];
    if(c.kind==='sub'){E.sub+=it.params.depth;E.subTypes[it.type]=1;}
    if(c.rock)E.rocks++;
    if(c.kind==='pool'){E.pool=it;E.poolSize+=it.params.size;}}
  E.surf=clamp(1+.2*Math.min(4,E.rocks)+.12*Math.min(6,E.sub),1,2.5);
  return E;
}

const esc=t=>String(t).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const label=it=>it.name||`${CAT[it.type].name} #${it.n}`;
function randName(){const used=new Set(S.items.map(i=>i.name));const free=PET_NAMES.filter(n=>!used.has(n));const L=free.length?free:PET_NAMES;return L[Math.floor(Math.random()*L.length)];}
function nextN(type){return Math.max(0,...S.items.filter(i=>i.type===type).map(i=>i.n))+1;}
function addItem(type,params,silent){
  const it=makeItem(type,params);it.n=nextN(type);S.items.push(it);
  const k=CAT[type].kind;
  if(k==='sub')buildJar();else buildItem(it);
  if(!silent){refreshLists();save();toast('已加入 '+CAT[type].name);}
  return it;
}
function removeItem(it,silent){
  const wasSub=CAT[it.type].kind==='sub';
  disposeObj(it.g);S.items=S.items.filter(x=>x!==it);if(S.sel===it)S.sel=null;
  if(wasSub)buildJar();
  if(!silent){refreshLists();renderEditor();save();}
}
function removeOne(type){
  const list=S.items.filter(i=>i.type===type);if(!list.length)return;
  const dead=list.find(i=>!i.alive);const it=dead||list[list.length-1];
  removeItem(it);toast('已移走 '+CAT[type].name);
}
function die(it,why,st){
  if(!it.alive)return;it.alive=false;it.deadT=0;it.why=why;
  const k=CAT[it.type].kind,c=st.c;
  if(st.mode==='aqua')c.detritus+=k==='plant'?5:k==='animal'?3:0;else c.waste+=k==='plant'?3:k==='animal'?2:0;
  if(st.trial){st.deaths=(st.deaths||[]);st.deaths.push({type:it.type,h:st.t||0,why});return;}
  logEv(`${label(it)}${it.name?'（'+CAT[it.type].name+'）':''} ${k==='microbe'?'失效':'死亡'}（${why}）`,'bad');
  if(S.sel===it)renderEditor();
  dirtyList=true;
}
function logEv(t,c){S.log.unshift({t,c,d:S.day,h:S.hour});if(S.log.length>50)S.log.pop();}

/* ================= 模擬（每小時） ================= */
let wasteFx=[];
function step(st){
  const c=st.c,light=isLight(st,st.hour),w=WX[st.wx],tr=MATS[st.mat].tr,lm=light?w.light*tr:0;
  const E=envInfo(st);
  const amb=w.t+(st.hour>=8&&st.hour<18?2:-2);
  const tgt=amb+(light?1.5:0)+(st.mode==='rain'&&st.heat&&light?5:0)+(st.sealed?.5:0);
  c.T+=(tgt-c.T)*.15;
  const q=clamp(1+.04*(c.T-25),.5,1.6);
  if(st.mode==='aqua')stepAqua(st,c,light,lm,q,E,w);else stepRain(st,c,light,lm,q,E,w);
  st.hour++;if(st.hour>=24){st.hour=0;st.day++;}
  st.t=(st.t||0)+1;
  if(!st.trial&&st.wxMode==='auto'){st.wxLeft--;if(st.wxLeft<=0){
    let r=Math.random(),nx=st.wx;for(const [k,p] of WXNEXT[st.wx]){r-=p;if(r<=0){nx=k;break;}}
    if(nx!==st.wx)logEv('天氣轉為'+WX[nx].n,'muted');st.wx=nx;st.wxLeft=Math.round(rnd(3,9));}}
}
function animalHealth(it,dh,st){
  it.health=clamp(it.health+dh,0,1);if(it.health<=0)die(it,it.stress||'衰弱',st);
}
function eat(it,st,c){
  const p=it.params,per=p.food/24;if(per<=0)return 1;
  let need=per,got=0;
  for(const [pool,w] of Object.entries(CAT[it.type].diet).sort((a,b)=>b[1]-a[1])){
    if(need<=1e-9)break;const take=Math.min(c[pool]||0,need/w);c[pool]-=take;got+=take*w;need-=take*w;}
  it.satiety=clamp(it.satiety+(got/per-1)/36,0,1);return got/per;
}
function stepAqua(st,c,light,lm,q,E,w){
  const V=st.V,sv=sat(c.T),co2f=(c.CO2/V)/((c.CO2/V)+.4);
  let o2p=0,o2u=0,grown=0;
  const useO2=x=>{const t=Math.min(c.O2,x);c.O2-=t;c.CO2+=t*1.375;o2u+=t;return t;};
  for(const it of aliveIn(st,'plant')){
    const p=it.params,h=it.health,C=CAT[it.type];
    useO2(p.resp*Math.max(.3,h)*q);
    if(lm>0){
      const prod=p.o2Prod*h*co2f*lm,kept=C.floating?.5:1;
      c.O2+=prod*kept;c.CO2=Math.max(0,c.CO2-prod*1.375);o2p+=prod*kept;it.lastProd=prod*kept;
      let need=p.uptake*h;const a=Math.min(c.NH3,need);c.NH3-=a;need-=a;const b=Math.min(c.NO3,need);c.NO3-=b;need-=b;
      it.nShort=need>p.uptake*h*.7?it.nShort+1:Math.max(0,it.nShort-2);
    } else it.lastProd=0;
    let dh=.003;it.stress='';
    if(it.nShort>60){dh=-.004;it.stress='缺養分';}
    if(st.light<5){dh=-.005;it.stress='光照不足';}
    if(c.NH3/V>3){dh-=.004;it.stress='氨太高';}
    if(C.root==='sand'&&!E.sub){dh=Math.min(dh,0)-.004;it.stress='冇底沙生根';}
    if(C.root==='rock'&&!E.rocks){dh=Math.min(dh,0)-.002;it.stress='冇石或沉木依附';}
    it.health=clamp(it.health+dh,0,1);if(it.health<=0)die(it,it.stress||'衰弱',st);
  }
  for(const it of aliveIn(st,'animal')){
    const p=it.params;useO2(p.resp*q);eat(it,st,c);
    it.wt+=1;if(it.wt>=p.wasteEvery){it.wt=0;c.NH3+=p.wasteAmt*.5;c.detritus+=p.wasteAmt*.5/.1;if(!st.trial)wasteFx.push(it);}
    const oc=c.O2/V,nc=c.NH3/V;let dh=.004;it.stress='';
    if(oc<p.o2Min){dh=-.03*(1+(p.o2Min-oc));it.stress='缺氧';}
    if(nc>p.nh3Tol){dh=Math.min(dh,0)-.012*(nc/p.nh3Tol);it.stress=it.stress||'氨中毒';}
    if(c.T<p.tMin||c.T>p.tMax){dh=Math.min(dh,0)-.008*(1+Math.max(p.tMin-c.T,c.T-p.tMax));it.stress=it.stress||(c.T<p.tMin?'水溫太凍':'水溫太熱');}
    if(it.satiety<=0){dh=Math.min(dh,0)-.006;it.stress=it.stress||'飢餓';}
    animalHealth(it,dh,st);
  }
  for(const it of aliveIn(st,'microbe')){
    const p=it.params;
    if(it.type==='nitri'){
      let conv=Math.min(c.NH3,p.cap*it.health*E.surf);if(p.o2PerN>0)conv=Math.min(conv,c.O2/p.o2PerN);
      c.NH3-=conv;c.NO3+=conv;c.O2-=conv*p.o2PerN;o2u+=conv*p.o2PerN;c.CO2=Math.max(0,c.CO2-conv*.5);
    } else {const d=Math.min(c.detritus,p.rate*it.health*E.surf);c.detritus-=d;c.NH3+=d*.1;useO2(d*p.o2Per);}
    it.stress=c.O2/V<1?'缺氧':'';it.health=clamp(it.health+(c.O2/V<1?-.01:.005),0,1);if(it.health<=0)die(it,'缺氧',st);
  }
  if(st.filter){
    let conv=Math.min(c.NH3,.012*V,c.O2/3.4);c.NH3-=conv;c.NO3+=conv;c.O2-=conv*3.4;o2u+=conv*3.4;
    const d=c.detritus*.04;c.detritus-=d;c.NO3+=d*.1;useO2(d*.1*3.4);
  }
  if(lm>0){
    const no3c=c.NO3/V;let g=(.04*c.algae+.01)*(no3c/(no3c+1.5))*Math.max(0,1-c.algae/60)*co2f*lm;
    g=Math.max(0,Math.min(g,c.NO3/.01));c.algae+=g;c.NO3-=g*.01;c.O2+=g*.6;c.CO2=Math.max(0,c.CO2-g*.8);o2p+=g*.6;grown=g;
  }
  useO2(.003*c.algae);
  const ad=c.algae*.004;c.algae-=ad;c.detritus+=ad;
  if(st.hour===st.feedHour&&st.feed>0){c.flake+=st.feed;if(!st.trial)feedFx(st.feed);}
  let d=c.flake*.04;c.flake-=d;c.detritus+=d;
  d=c.detritus*.02;c.detritus-=d;c.NH3+=d*.1;useO2(d*.3);
  let k=st.sealed?.002:.06*J.open;if(st.filter&&!st.sealed)k+=.02;
  c.O2+=(sv*V-c.O2)*k;c.CO2+=(.6*V-c.CO2)*k;
  if(st.pump){const kp=st.sealed?.04:.15;c.O2+=(sv*V-c.O2)*kp;c.CO2+=(.6*V-c.CO2)*kp;}
  if(!st.sealed&&w.rain){const f=.01*w.rain*J.open;c.NH3*=1-f;c.NO3*=1-f;}
  c.O2=clamp(c.O2,0,sv*1.7*V);for(const key of ['CO2','NH3','NO3','algae','flake','detritus'])c[key]=Math.max(0,c[key]);
  st.hist.push({o2:c.O2/V,nh3:c.NH3/V,no3:c.NO3/V,co2:c.CO2/V,algae:c.algae,T:c.T,light,o2p,o2u,grown});
  if(st.hist.length>240)st.hist.shift();
  if(!st.trial){
    const oc=c.O2/V;
    if(oc<2&&!st._lowO2){st._lowO2=true;logEv(`溶氧跌到 ${fx(oc)} mg/L`,'warn');}if(oc>4)st._lowO2=false;
    if(c.NH3/V>.5&&!st._hiN){st._hiN=true;logEv(`氨升到 ${fx(c.NH3/V,2)} mg/L`,'warn');}if(c.NH3/V<.3)st._hiN=false;
    if(c.algae>35&&!st._bloom){st._bloom=true;logEv('藻類爆發，水開始變綠','warn');}if(c.algae<25)st._bloom=false;
  }
}
function stepRain(st,c,light,lm,q,E,w){
  const V=st.V,a=airL(st),ppm=c.CO2/(a*.0018),co2f=ppm/(ppm+300),hf=Math.min(2,4/V);
  let o2p=0,o2u=0;
  const useO2=x=>{const t=Math.min(c.O2,x);c.O2-=t;c.CO2+=t*1.375;o2u+=t;};
  for(const it of aliveIn(st,'plant')){
    const p=it.params,h=it.health;useO2(p.resp*Math.max(.3,h)*q);
    if(lm>0){const prod=p.o2Prod*h*co2f*lm;c.O2+=prod;c.CO2=Math.max(0,c.CO2-prod*1.375);o2p+=prod;it.lastProd=prod;
      const u=Math.min(c.soilN,p.uptake*h);c.soilN-=u;it.nShort=u<p.uptake*h*.3?it.nShort+1:Math.max(0,it.nShort-2);} else it.lastProd=0;
    c.hum+=p.transp*h*(light?1:.3)*hf;
    let dh=.003;it.stress='';
    if(!E.subTypes.soil){dh=-.004;it.stress='冇泥土';}
    if(c.hum<p.humMin){dh=Math.min(dh,0)-.006*(1+(p.humMin-c.hum)/10);it.stress=it.stress||'太乾';}
    if(c.mould>40){dh=Math.min(dh,0)-.004;it.stress=it.stress||'霉菌';}
    if(it.nShort>72){dh=Math.min(dh,0)-.003;it.stress=it.stress||'缺養分';}
    if(st.light<5){dh=-.005;it.stress='光照不足';}
    it.health=clamp(it.health+dh,0,1);if(it.health<=0)die(it,it.stress||'衰弱',st);
  }
  const poolL=E.pool?.25*V*E.poolSize:0;
  for(const it of aliveIn(st,'animal')){
    const p=it.params,C=CAT[it.type];useO2(p.resp*q);eat(it,st,c);
    it.wt+=1;if(it.wt>=p.wasteEvery){it.wt=0;if(C.pool&&E.pool)c.pNH3+=p.wasteAmt*.1;else c.waste+=p.wasteAmt;if(!st.trial)wasteFx.push(it);}
    const o2pct=c.O2/(a*13.3),pp=c.CO2/(a*.0018);let dh=.004;it.stress='';
    if(c.hum<p.humMin||c.hum>p.humMax){dh=-.006*(1+Math.max(p.humMin-c.hum,c.hum-p.humMax)/10);it.stress=c.hum<p.humMin?'太乾':'太濕';}
    if(c.T<p.tMin||c.T>p.tMax){dh=Math.min(dh,0)-.008*(1+Math.max(p.tMin-c.T,c.T-p.tMax));it.stress=it.stress||(c.T<p.tMin?'太凍':'太熱');}
    if(o2pct<17){dh=Math.min(dh,0)-.02*(17-o2pct);it.stress=it.stress||'缺氧';}
    if(pp>5000){dh=Math.min(dh,0)-.01*(pp/5000);it.stress=it.stress||'二氧化碳過高';}
    if(c.mould>20&&!C.mouldOK){dh=Math.min(dh,0)-.004*(c.mould/20);it.stress=it.stress||'霉菌';}
    if(C.pool){if(!E.pool){dh=Math.min(dh,0)-.01;it.stress=it.stress||'冇水池';}
      else if(c.pNH3/poolL>p.nh3Tol){dh=Math.min(dh,0)-.01*(c.pNH3/poolL/p.nh3Tol);it.stress=it.stress||'水池氨高';}}
    if(it.satiety<=0){dh=Math.min(dh,0)-.006;it.stress=it.stress||'飢餓';}
    animalHealth(it,dh,st);
  }
  for(const it of aliveIn(st,'microbe')){
    const p=it.params,d=Math.min(c.waste,p.rate*it.health*E.surf);c.waste-=d;c.soilN+=d;useO2(d*p.o2Per);
    it.stress=c.hum<40?'泥土太乾':'';it.health=clamp(it.health+(c.hum<40?-.005:.005),0,1);if(it.health<=0)die(it,'泥土太乾',st);
  }
  let d=c.waste*.005;c.waste-=d;c.soilN+=d;
  if(st.hour===st.feedHour&&st.feed>0)c.feed+=st.feed;
  d=c.feed*.04;c.feed-=d;c.waste+=d;
  if(st.mist>0){for(let i=0;i<st.mist;i++)if(st.hour===8+Math.floor(i*12/st.mist)){c.hum+=12*hf;if(!st.trial)mistFx=1.5;}}
  if(E.pool)c.hum+=.35*E.poolSize*hf;
  if(st.heat&&light)c.hum-=.8;
  const kh=st.sealed?.01:.12*Math.max(.3,J.open);c.hum+=(w.hum-c.hum)*kh;
  if(!st.sealed&&w.rain){c.hum+=2*w.rain*J.open;if(E.pool)c.pNH3*=1-.03*w.rain*J.open;}
  c.hum=clamp(c.hum,15,100);
  const k=st.sealed?.003:.12*J.open;c.O2+=(a*13.3*21-c.O2)*k;c.CO2+=(a*.0018*420-c.CO2)*k;
  if(c.hum>80)c.mould+=(.012*c.waste+.03*c.mould)*(c.hum-80)/20+.004;else c.mould-=c.mould*.03;
  c.mould=clamp(c.mould,0,60);
  if(E.pool)c.pNH3-=c.pNH3*(.01+(st.filter?.1:0));
  for(const key of ['O2','CO2','waste','soilN','feed','pNH3'])c[key]=Math.max(0,c[key]);
  st.hist.push({o2:c.O2/(a*13.3),co2:c.CO2/(a*.0018),hum:c.hum,T:c.T,waste:c.waste,mould:c.mould,pnh3:poolL?c.pNH3/poolL:0,light,o2p,o2u});
  if(st.hist.length>240)st.hist.shift();
  if(!st.trial){
    if(c.mould>20&&!st._mould){st._mould=true;logEv('開始生霉','warn');}if(c.mould<10)st._mould=false;
    if(c.CO2/(a*.0018)>5000&&!st._co2){st._co2=true;logEv('二氧化碳超過 5000 ppm','warn');}if(c.CO2/(a*.0018)<3000)st._co2=false;
  }
}

/* ================= 試算：預測 & 一鍵平衡 ================= */
function trialState(cfg){
  const st={mode:S.mode,V:S.V,shape:S.shape,mat:S.mat,sealed:S.sealed,light:S.light,feed:S.feed,feedHour:S.feedHour,pump:S.pump,filter:S.filter,mist:S.mist,heat:S.heat,
    wx:S.wxMode==='auto'?'cloudy':S.wxMode,wxMode:'fixed',hour:S.hour,day:S.day,trial:true,t:0,deaths:[],
    c:Object.assign({},S.c),hist:[],
    items:S.items.filter(i=>i.alive).map(i=>({type:i.type,uid:i.uid,params:Object.assign({},i.params),alive:true,health:i.health,satiety:i.satiety,wt:i.wt,nShort:i.nShort,stress:'',lastProd:0}))};
  if(cfg){Object.assign(st,cfg.env);cfg.add.forEach(t=>{const it=makeItem(t);S.uid--;st.items.push(it);});
    resetChem(st);st.items.forEach(i=>{i.health=1;i.satiety=1;i.nShort=0;});}
  return st;
}
function forecast(h){
  const st=trialState(null);const ks=st.mode==='aqua'?['o2','nh3','algae','T']:['o2','co2','hum','T','mould','pnh3'];
  const mn={},mx={};ks.forEach(k=>{mn[k]=Infinity;mx[k]=-Infinity;});const stress={};
  for(let i=0;i<h;i++){step(st);const r=st.hist[st.hist.length-1];ks.forEach(k=>{mn[k]=Math.min(mn[k],r[k]);mx[k]=Math.max(mx[k],r[k]);});
    st.items.forEach(it=>{if(it.alive&&it.stress&&CAT[it.type].kind==='animal')stress[it.stress]=(stress[it.stress]||0)+1;});}
  return {mn,mx,deaths:st.deaths,stress};
}
function score(cfg){
  const st=trialState(cfg);let s=0;const H=120;
  for(let i=0;i<H;i++){step(st);
    for(const it of st.items){if(!it.alive)continue;const k=CAT[it.type].kind;if(it.stress)s+=k==='animal'?1:k==='plant'?.4:.2;}
    const c=st.c;
    if(st.mode==='aqua'){if(c.algae>35)s+=1;if(c.NH3/st.V>.25)s+=1;if(c.O2/st.V<3)s+=.5;}
    else{if(c.mould>15)s+=1;}
  }
  s+=st.deaths.length*200;
  s+=cfg.add.length*4+(cfg.env.pump?2:0)+(cfg.env.filter?2:0)+(cfg.env.heat?1:0)+cfg.env.feed*.3+Math.abs(cfg.env.light-12)*.3+cfg.env.mist*.4;
  return s;
}
function autoBalance(){
  const E=envInfo(S),aq=S.mode==='aqua';
  const env={light:S.light,feed:S.feed,pump:S.pump,filter:S.filter,sealed:S.sealed,mist:S.mist,heat:S.heat};
  let cfg={env,add:[]};
  const alivePlants=S.items.filter(i=>i.alive&&CAT[i.type].kind==='plant');
  const aliveAn=S.items.filter(i=>i.alive&&CAT[i.type].kind==='animal');
  // 必需品先補
  if(aq&&!E.sub&&alivePlants.some(i=>CAT[i.type].root==='sand'))cfg.add.push('sand');
  if(aq&&!E.rocks&&alivePlants.some(i=>CAT[i.type].root==='rock'))cfg.add.push('stone');
  if(!aq&&!E.subTypes.soil&&(alivePlants.length||aliveAn.length))cfg.add.push('soil');
  if(!aq&&!E.pool&&aliveAn.some(i=>CAT[i.type].pool))cfg.add.push('pool');
  const feeders=aliveAn.some(i=>{const d=CAT[i.type].diet;return d.flake||d.feed;});
  const acts=c=>{const L=[],e=c.env,mk=(ch,add)=>({env:Object.assign({},e,ch),add:add?[...c.add,add]:c.add.slice()});
    if(e.light<16)L.push(mk({light:e.light+2}));if(e.light>6)L.push(mk({light:e.light-2}));
    if(feeders){L.push(mk({feed:e.feed+.5}));if(e.feed>0)L.push(mk({feed:Math.max(0,e.feed-.5)}));}
    L.push(mk({sealed:!e.sealed}));
    if(aq){L.push(mk({pump:!e.pump}));L.push(mk({filter:!e.filter}));
      ['hornwort','nitri','duckweed','amano','snail'].forEach(t=>{if(c.add.filter(x=>x===t).length<3)L.push(mk({},t));});}
    else{if(e.mist<6)L.push(mk({mist:e.mist+1}));if(e.mist>0)L.push(mk({mist:e.mist-1}));L.push(mk({heat:!e.heat}));
      if(E.pool||c.add.includes('pool'))L.push(mk({filter:!e.filter}));
      ['pothos','fern','soilmic','springtail','isopod'].forEach(t=>{if(c.add.filter(x=>x===t).length<3)L.push(mk({},t));});}
    return L;};
  let best=score(cfg);const start=best;
  for(let it=0;it<14;it++){let imp=null,bs=best;for(const c2 of acts(cfg)){const s=score(c2);if(s<bs-.5){bs=s;imp=c2;}}if(!imp)break;cfg=imp;best=bs;}
  // 套用
  const changes=[];const e=cfg.env;

const J={R:1,H:2.4,sTop:.02,wTop:2,box:false,pts:[],open:1,minR:1,k:1,subs:[]};
function rAt(y){if(J.box)return J.R;const t=clamp(y/J.H,0,1),Pt=J.pts;
  for(let i=1;i<Pt.length;i++){if(Pt[i].y>=t){const a=Pt[i-1],b=Pt[i],f=(t-a.y)/((b.y-a.y)||1);return(a.x+(b.x-a.x)*f)*J.R;}}return Pt[Pt.length-1].x*J.R;}
function randIn(y,f){if(J.box)return[rnd(-1,1)*J.R*f,rnd(-1,1)*J.R*f];const a=rnd(0,6.28),r=Math.sqrt(Math.random())*rAt(y)*f;return[Math.cos(a)*r,Math.sin(a)*r];}
function edgeFrac(p){return J.box?Math.max(Math.abs(p.x),Math.abs(p.z))/J.R:Math.hypot(p.x,p.z)/Math.max(.01,rAt(p.y));}
function clampIn(p,f){if(J.box){const m=J.R*f;p.x=clamp(p.x,-m,m);p.z=clamp(p.z,-m,m);return;}const m=rAt(p.y)*f,r=Math.hypot(p.x,p.z);if(r>m){p.x*=m/r;p.z*=m/r;}}
function shapeSamples(sh){const pts=sh.prof.map(([r,y])=>new THREE.Vector2(r,y));return pts.length>2?new THREE.SplineCurve(pts).getPoints(60):pts;}
function floorMap(x,z){const f=(J.box?J.R:rAt(J.sTop))*.72;return[x*f,z*f];}

function disposeObj(o){if(!o)return;o.parent&&o.parent.remove(o);o.traverse(c=>{c.geometry&&c.geometry.dispose();if(c.material)(Array.isArray(c.material)?c.material:[c.material]).forEach(m=>m.dispose());});}
function latheBand(y0,y1,scale,phi0,phiL){
  const out=[new THREE.Vector2(rAt(y0)*scale,y0)];J.pts.forEach(p=>{const y=p.y*J.H;if(y>y0&&y<y1)out.push(new THREE.Vector2(p.x*scale*J.R,y));});out.push(new THREE.Vector2(rAt(y1)*scale,y1));
  return new THREE.LatheGeometry(out,phiL?16:72,phi0||0,phiL||Math.PI*2);
}

function buildJar(){
  while(jarG.children.length)disposeObj(jarG.children[0]);
  const sh=SHAPES[S.shape],M=MATS[S.mat],k=Math.cbrt(S.V/4);
  J.k=k;J.box=!!sh.box;J.R=sh.R*k;J.H=sh.H*k;J.pts=shapeSamples(sh);
  let y=.008*k;J.subs={};
  for(const it of S.items)if(it.alive&&CAT[it.type].kind==='sub'){const d=it.params.depth*.025*k;J.subs[it.uid]=[y,y+d];y+=d;}
  J.sTop=Math.min(y,J.H*.35);
  J.wTop=S.mode==='aqua'?J.H*sh.w:J.H*.9;
  const {R,H}=J;
  const maxR=J.box?R:Math.max(...J.pts.map(p=>p.x))*R;
  J.open=J.box?1:Math.pow(rAt(H)/maxR,2);
  J.minR=J.box?R:Math.min(...[0,.2,.4,.6,.8,1].map(f=>rAt(J.sTop+f*(Math.min(J.wTop,H*.85)-J.sTop))));

  glassMat.userData.base=M.op;
  const hlMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:M.sh>20?.09:.02,side:THREE.DoubleSide,depthWrite:false});
  const hidden=new THREE.MeshBasicMaterial({visible:false});
  if(J.box){
    const g=new THREE.BoxGeometry(2*R,H,2*R).translate(0,H/2,0);
    jarG.add(new THREE.Mesh(g,[glassMat,glassMat,hidden,glassMat,glassMat,glassMat]));
    jarG.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0x2c3a3c,transparent:true,opacity:.55})));
    const hl=new THREE.Mesh(new THREE.PlaneGeometry(R*.12,H*.85),hlMat);hl.position.set(R*.55,H*.5,R+.004);jarG.add(hl);
  } else {
    jarG.add(new THREE.Mesh(latheBand(0,H,1),glassMat));
    jarG.add(new THREE.Mesh(latheBand(H*.04,H*.96,1.004,.4,.24),hlMat));
    const bot=new THREE.Mesh(new THREE.CircleGeometry(rAt(0),72),glassMat);bot.rotation.x=-Math.PI/2;bot.position.y=.002;jarG.add(bot);
    const rim=new THREE.Mesh(new THREE.TorusGeometry(rAt(H),.025*k,8,72),glassMat.clone());rim.material.opacity=Math.min(.6,M.op*2.5);rim.rotation.x=Math.PI/2;rim.position.y=H;jarG.add(rim);
  }
  waterMat=surfMat=null;
  if(S.mode==='aqua'){
    waterMat=new THREE.MeshPhongMaterial({color:0x9fd6e0,transparent:true,opacity:.18,shininess:60,depthWrite:false,side:THREE.DoubleSide});
    surfMat=new THREE.MeshPhongMaterial({color:0xbfe6ee,transparent:true,opacity:.32,shininess:140,specular:0xffffff,side:THREE.DoubleSide,depthWrite:false});
    if(J.box){
      jarG.add(new THREE.Mesh(new THREE.BoxGeometry(2*R*.985,J.wTop-J.sTop,2*R*.985).translate(0,(J.wTop+J.sTop)/2,0),[waterMat,waterMat,hidden,hidden,waterMat,waterMat]));
      const s=new THREE.Mesh(new THREE.PlaneGeometry(2*R*.985,2*R*.985),surfMat);s.rotation.x=-Math.PI/2;s.position.y=J.wTop;jarG.add(s);
    } else {
      jarG.add(new THREE.Mesh(latheBand(J.sTop,J.wTop,.985),waterMat));
      const s=new THREE.Mesh(new THREE.CircleGeometry(rAt(J.wTop)*.985,72),surfMat);s.rotation.x=-Math.PI/2;s.position.y=J.wTop;jarG.add(s);
    }
  }
  lid=new THREE.Group();
  if(J.box){const l=new THREE.Mesh(new THREE.BoxGeometry(2*R+.04,.03,2*R+.04),glassMat.clone());l.material.opacity=Math.min(.6,M.op*2);l.position.y=H+.02;lid.add(l);}
  else{const rt=rAt(H);const cork=new THREE.Mesh(new THREE.CylinderGeometry(rt*.97,rt*.9,Math.max(.12,rt*.25),40),mat(0xa77a4c));cork.position.y=H+.03;lid.add(cork);}
  jarG.add(lid);
  lampMat=new THREE.MeshBasicMaterial({color:0xfff3c4});
  const ly=H+.9*k;
  const lamp=new THREE.Mesh(new THREE.CylinderGeometry(maxR*.5,maxR*.5,.04,32),lampMat);lamp.position.y=ly;jarG.add(lamp);
  const cord=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,3,4),mat(0x333333));cord.position.y=ly+1.5;jarG.add(cord);
  // 氧氣泵（氣石）同過濾器
  pumpG=new THREE.Group();
  const [px,pz]=J.box?[-R*.7,R*.55]:[Math.cos(2.4)*rAt(J.sTop)*.75,Math.sin(2.4)*rAt(J.sTop)*.75];
  const stoneM=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.05,12),mat(0xd9d4cc));stoneM.position.set(px,J.sTop+.025,pz);pumpG.add(stoneM);
  const tube=new THREE.Mesh(new THREE.CylinderGeometry(.006,.006,H-J.sTop,4),mat(0x9fc6b8,{transparent:true,opacity:.6}));tube.position.set(px*1.12,(H+J.sTop)/2,pz*1.12);pumpG.add(tube);
  pumpG.userData.src=new THREE.Vector3(px,J.sTop+.05,pz);jarG.add(pumpG);
  filterG=new THREE.Group();
  const [fx2,fz]=J.box?[R*.7,-R*.65]:[Math.cos(-.9)*rAt(J.sTop)*.7,Math.sin(-.9)*rAt(J.sTop)*.7];
  const sponge=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.22,14),mat(0x1d1f22));sponge.position.set(fx2,J.sTop+.11,fz);filterG.add(sponge);
  const ft=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.45,8),mat(0x6d7a80));ft.position.set(fx2,J.sTop+.4,fz);filterG.add(ft);
  filterG.userData.src=new THREE.Vector3(fx2,J.sTop+.62,fz);jarG.add(filterG);
  // 重建生物
  S.items.forEach(it=>{if(it.g)disposeObj(it.g);it.g=null;if(!it.alive){it.gone=true;return;}buildItem(it);});
  S.items=S.items.filter(i=>!i.gone);
  if(S.sel&&!S.items.includes(S.sel))S.sel=null;
  dirtyList=true;

  buildMicrobeLayer();layoutWeather(maxR);
}

function plantStem(color,leafGeo,leafN,spacing,tilt){
  const g=new THREE.Group(),h=clamp(rnd(.65,1)*(Math.min(J.wTop,J.H*.85)-J.sTop)*.8,.3,3);
  const bb=Math.min(.2,J.minR*.15),bx=rnd(-bb,bb),bz=rnd(-bb,bb),pts=[];
  for(let i=0;i<=4;i++){const t=i/4;pts.push(new THREE.Vector3(bx*t*t,t*h,bz*t*t));}
  const curve=new THREE.CatmullRomCurve3(pts),m=mat(color,{side:THREE.DoubleSide});
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,16,.01,5,false),m));
  const wh=Math.floor(h/spacing),im=new THREE.InstancedMesh(leafGeo,m,wh*leafN),d=new THREE.Object3D();let k=0;
  for(let w=0;w<wh;w++){const t=(w+1)/(wh+1),p=curve.getPoint(t),s=1.15-.6*t;

}

  if(aq&&S.filter&&Math.random()<dt*8){const s=filterG.userData.src;bubbleAt(s.x,s.y,s.z,rnd(.006,.011));}
  if(microbeLayer){const m=aliveIn(S,'microbe');microbeLayer.material.opacity=m.length?.25+.35*Math.max(...m.map(i=>i.health)):0;}
  const oc=aq?c.O2/S.V:9,pi=aq?null:poolInfo();
  for(const it of S.items){
    const g=it.g;if(!g)continue;const C=CAT[it.type],k=C.kind,m=it.m;
    if(!it.alive){
      it.deadT+=dt;const u=g.userData;
      if(u.inner)u.inner.rotation.x=Math.min(Math.PI,u.inner.rotation.x+dt*2);
      if(C.move==='swim'){m.p.y=Math.min(J.wTop-.04,m.p.y+dt*.12);g.position.copy(m.p);}
      if(k==='plant')g.scale.y=Math.max(.2,1-it.deadT*.08);
      g.traverse(o=>{if(o.material&&!Array.isArray(o.material)){o.material.transparent=true;if(o.material.color&&k!=='plant')o.material.color.lerp(grayC,dt*.5);if(k==='plant'&&o.material.color)o.material.color.lerp(new THREE.Color(0x6b5a3a),dt*.4);o.material.opacity=clamp(1-(it.deadT-5)/4,0,1);}});
      if(it.deadT>9){disposeObj(g);it.g=null;it.gone=true;}
      continue;
    }
    if(k==='plant'){
      if(it.type==='hornwort'||it.type==='elodea')g.rotation.z=Math.sin(tAll*.7+m.ph)*.04;
      if(g.userData.blades)g.userData.blades.forEach(b=>{b.rotation.z=Math.sin(tAll*.8+b.userData.ph)*(aq?.07:.03);});
      if(it.type==='duckweed'){g.position.x+=Math.sin(tAll*.2+m.ph)*dt*.01;g.position.z+=Math.cos(tAll*.17+m.ph)*dt*.01;}
      if(aq&&!C.floating&&Math.random()<it.lastProd*lv*2.2*vis*dt)bubbleAt(g.position.x+rnd(-.08,.08),g.position.y+rnd(.1,1)*(g.userData.top||.2),g.position.z+rnd(-.08,.08),rnd(.008,.016));
      continue;
    }
    if(k!=='animal')continue;
    const mv=C.move,p=it.params,u=g.userData,hb=.5+.5*it.health;
    if(mv==='swim'){
      m.tt-=dt;
      if(m.tt<=0||m.p.distanceTo(m.tgt)<.08){const y=rnd(J.sTop+.15,J.wTop-.12),[x,z]=randIn(y,.72);m.tgt.set(x,y,z);m.tt=rnd(2.5,6);}
      if(oc<p.o2Min+.6){m.tgt.y=J.wTop-.07;clampIn(m.tgt,.7);}
      steer(m,(it.stress?.14:.24)*hb,dt,1.6);
      u.tail.rotation.y=Math.sin(tAll*(8+m.v.length()*30)+m.ph)*.45;
    } else if(mv==='hop'){
      m.tt-=dt;if(m.tt<=0){const y=J.sTop+rnd(.02,Math.min(.45,J.wTop-J.sTop-.1)),[x,z]=randIn(y,.75);m.tgt.set(x,y,z);m.tt=rnd(1.5,5);m.spd=rnd(.18,.32);}
      m.spd=Math.max(.015,m.spd*(1-dt*1.4));
      const d=m.tgt.clone().sub(m.p),l=d.length();if(l>.02)d.multiplyScalar(m.spd/l);else d.set(0,-.02,0);m.v.lerp(d,Math.min(1,dt*3));
    } else if(mv==='crawl'){
      m.hd+=rnd(-1,1)*dt*.8;if(edgeFrac(m.p)>.8)m.hd=Math.atan2(-m.p.z,-m.p.x)+rnd(-.3,.3);
      const s=.02*hb;m.v.set(Math.cos(m.hd)*s,0,Math.sin(m.hd)*s);
    } else if(mv==='swarm'){
      m.tt-=dt;if(m.tt<=0){const y=rnd(J.sTop+.2,J.wTop-.15),[x,z]=randIn(y,.6);m.tgt.set(x,y,z);m.tt=rnd(4,8);}
      steer(m,.05,dt,1);
      const arr=g.geometry.attributes.position.array,off=u.off,rad=u.rad;
      off.forEach((o,i)=>{o.x+=rnd(-1,1)*dt*.08;o.y+=rnd(-1,1)*dt*.08;o.z+=rnd(-1,1)*dt*.08;if(o.length()>rad)o.multiplyScalar(.95);arr[i*3]=o.x;arr[i*3+1]=o.y;arr[i*3+2]=o.z;});
      g.geometry.attributes.position.needsUpdate=true;
    } else if(mv==='spring'){
      const arr=g.geometry.attributes.position.array,off=u.off;
      off.forEach((o,i)=>{if(Math.random()<dt*.6){o.x+=rnd(-.08,.08);o.z+=rnd(-.08,.08);}o.y=Math.max(0,o.y*.9);if(Math.hypot(o.x,o.z)>.25){o.x*=.9;o.z*=.9;}arr[i*3]=o.x;arr[i*3+1]=Math.abs(Math.sin(tAll*3+i))*.006;arr[i*3+2]=o.z;});
      g.geometry.attributes.position.needsUpdate=true;continue;
    } else if(mv==='colony'){
      it.agents.forEach(a=>{a.hd+=rnd(-1,1)*dt*1.5;if(edgeFrac(a.p)>.85)a.hd=Math.atan2(-a.p.z,-a.p.x)+rnd(-.3,.3);
        const s=.03*hb;a.p.x+=Math.cos(a.hd)*s*dt*vis;a.p.z+=Math.sin(a.hd)*s*dt*vis;a.p.y=J.sTop+.006;clampIn(a.p,.88);a.mesh.position.copy(a.p);a.mesh.rotation.y=-a.hd;});
      m.p.copy(it.agents[0].p);continue;
    } else if(mv==='turtle'){
      m.tt-=dt;
      if(m.tt<=0||m.p.distanceTo(m.tgt)<.05){
        if(pi&&Math.random()<.55){const a=rnd(0,6.28),r=Math.sqrt(Math.random())*pi.r*.6;m.tgt.set(pi.x+Math.cos(a)*r,J.sTop+.006,pi.z+Math.sin(a)*r);}
        else{const [x,z]=randIn(J.sTop,.75);m.tgt.set(x,J.sTop+.006,z);}
        m.tt=rnd(5,12);}
      const inPool=pi&&Math.hypot(m.p.x-pi.x,m.p.z-pi.z)<pi.r;
      steer(m,(inPool?.07:.045)*hb,dt,1.2);m.v.y=0;
      if(inPool)m.p.y=J.sTop+.004+Math.sin(tAll*2+m.ph)*.003;else m.p.y=J.sTop+.006;
    } else if(mv==='climb'){
      m.tt-=dt;
      if(m.tt<=0){if(Math.random()<.5){const [x,z]=randIn(J.sTop,.7);m.tgt.set(x,J.sTop+.01,z);}
        else{const y=rnd(J.sTop+.15,J.H*.75);if(J.box){const s=Math.random()<.5?1:-1,o=rnd(-.8,.8)*J.R;Math.random()<.5?m.tgt.set(s*J.R*.93,y,o):m.tgt.set(o,y,s*J.R*.93);}
          else{const a=rnd(0,6.28),r=rAt(y)*.93;m.tgt.set(Math.cos(a)*r,y,Math.sin(a)*r);}}
        m.tt=rnd(4,9);m.spd=rnd(.08,.14);}
      m.spd=Math.max(.01,m.spd*(1-dt*.4));steer(m,m.spd*hb,dt,2);
    } else if(mv==='frog'){
      if(m.hop>0){m.hop=Math.max(0,m.hop-dt*2.2);const f=1-m.hop;m.p.lerpVectors(m.h0,m.tgt,f);m.p.y=J.sTop+.004+Math.sin(Math.PI*f)*.09;
        g.position.copy(m.p);const d=m.tgt.clone().sub(m.h0);g.rotation.y=Math.atan2(-d.z,d.x);continue;}
      m.tt-=dt;if(m.tt<=0){m.h0.copy(m.p);const a=rnd(0,6.28),r=rnd(.08,.25);m.tgt.set(m.p.x+Math.cos(a)*r,J.sTop+.004,m.p.z+Math.sin(a)*r);clampIn(m.tgt,.8);m.hop=1;m.tt=rnd(1.5,5);}
      continue;
    }
    m.p.addScaledVector(m.v,dt*vis);
    if(mv==='climb'){m.p.y=clamp(m.p.y,J.sTop+.01,J.H*.85);clampIn(m.p,.95);}
    else if(mv==='turtle'){clampIn(m.p,.86);}
    else{m.p.y=clamp(m.p.y,J.sTop+.02,J.wTop-.04);if(mv==='crawl')m.p.y=J.sTop+.005;clampIn(m.p,.86);}
    g.position.copy(m.p);
    if(mv==='swarm')continue;
    face(g,m.v,mv==='climb'?1.4:mv==='crawl'||mv==='turtle'?0:.5);
  }
  if(S.items.some(i=>i.gone)){S.items=S.items.filter(i=>!i.gone);dirtyList=true;}
  for(const it of wasteFx.splice(0)){if(!it.alive||!it.g)continue;if(poops.filter(p=>p.visible).length>60)break;const pp=spawn(poops,poopMat,.007,70);if(pp){pp.position.copy(it.m.p);pp.scale.set(.006,.006,.014);}}
  bubbles.forEach(b=>{if(!b.visible)return;b.position.y+=b.userData.vy*dt;b.position.x+=Math.sin(tAll*5+b.id)*dt*.01;if(b.position.y>J.wTop)b.visible=false;});
  poops.forEach(p=>{if(!p.visible)return;p.userData.age+=dt;if(p.position.y>J.sTop+.01)p.position.y-=dt*.08;if(p.userData.age>25)p.visible=false;});
  const want=aq?Math.ceil(c.flake*8):0;let shown=0;
  flakes.forEach(f=>{if(!f.visible)return;shown++;if(shown>want){f.visible=false;return;}if(f.position.y>J.sTop+.01){f.position.y-=f.userData.vy*dt;f.rotation.z+=dt;f.position.x+=Math.sin(tAll+f.id)*dt*.02;}});
  if(S.sel&&S.sel.alive&&S.sel.g){const it=S.sel,k=CAT[it.type].kind;ring.visible=true;
    if(k==='animal'){ring.position.copy(it.m.p);ring.scale.setScalar(CAT[it.type].move==='turtle'?.14:.1);}
    else if(k==='microbe'||k==='sub'){ring.position.set(0,J.sTop+.02,0);ring.scale.setScalar((J.box?J.R:rAt(J.sTop))*.7);}
    else if(k==='pool'){ring.position.set(it.g.position.x,J.sTop+.02,it.g.position.z);ring.scale.setScalar(it.g.userData.r*1.15);}
    else{ring.position.set(it.g.position.x,it.g.position.y+.02,it.g.position.z);ring.scale.setScalar(k==='decor'?.25*it.params.size*J.k:it.type==='duckweed'?.26:.16);}
    ring.material.opacity=.55+.35*Math.sin(tAll*4);} else ring.visible=false;
  if(!ptrs.size){cam.idle+=dt;if(cam.idle>4&&!matchMedia('(prefers-reduced-motion: reduce)').matches)cam.theta+=dt*.06;}
  updateCam();
}

function paramChips(type){const p=CAT[type].params,g=CAT[type].g;
  if(g==='aplant')return[`產氧 ${p.o2Prod} mg/h`,`耗氧 ${p.resp} mg/h`,`吸收 ${p.uptake} mg/h`];
  if(g==='rplant')return[`產氧 ${p.o2Prod} mg/h`,`加濕 ${p.transp}%/h`,`濕度 ≥${p.humMin}%`];
  if(g==='aanimal')return[`耗氧 ${p.resp} mg/h`,`食 ${p.food} 份/日`,`每 ${p.wasteEvery} 小時去廁所`,`${p.tMin}–${p.tMax}°C`];
  if(g==='ranimal'||g==='turtle')return[`食 ${p.food} 份/日`,`每 ${p.wasteEvery} 小時去廁所`,`濕度 ${p.humMin}–${p.humMax}%`,`${p.tMin}–${p.tMax}°C`];
  if(g==='nitri')return[`分解氨 ${p.cap} mg/h`];
  if(g==='decomp'||g==='soilm')return[`分解 ${p.rate} 份/h`];
  if(g==='sub')return[`厚 ${p.depth} cm`];
  return[];}

      <div class="chips">${paramChips(id).map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>`;}).join('')}</section>`).join('');

function statusOf(it){
  const k=CAT[it.type].kind;
  if(!it.alive)return['已死亡','bad'];
  if(k==='sub')return[`${it.params.depth} cm 厚`,''];
  if(k==='decor'||k==='pool')return['造景',''];
  if(it.stress)return[it.stress,it.health<.4?'bad':'warn'];
  if(k==='plant')return[it.lastProd>0?`產氧中 ${fx(it.lastProd,2)} mg/h`:'夜間休息',''];
  if(k==='animal')return[it.satiety<.4?'有啲肚餓':'精神',''];
  return['運作中',''];
}

  $('#edClose').onclick=()=>{S.sel=null;renderJarList();renderEditor();};
  const nm=$('#p-name');if(nm){const apply=v=>{it.name=v.trim().slice(0,12);$('#edTitle').textContent=label(it);const li=$('#nm-'+it.uid);if(li)li.textContent=label(it);save();};
    nm.oninput=()=>apply(nm.value);$('#nameRnd').onclick=()=>{nm.value=randName();apply(nm.value);};}

const AQ_METERS=[['o2','溶氧 O₂',c=>c.O2/S.V,'mg/L',1,14,v=>v<3?'bad':v<5?'warn':''],['T','水溫',c=>c.T,'°C',1,40,v=>v<12||v>31?'warn':''],
  ['nh3','氨 NH₃',c=>c.NH3/S.V,'mg/L',2,1,v=>v>.5?'bad':v>.2?'warn':''],['no3','硝酸鹽',c=>c.NO3/S.V,'mg/L',1,50,v=>v>40?'bad':v>20?'warn':''],
  ['co2','CO₂',c=>c.CO2/S.V,'mg/L',2,6,v=>v<.3?'warn':''],['algae','藻類',c=>c.algae,'份',0,60,v=>v>45?'bad':v>30?'warn':''],['food','飼料/殘渣',c=>c.flake+c.detritus,'份',1,20,v=>v>15?'warn':'']];
const RN_METERS=[['o2','空氣 O₂',c=>c.O2/(airL(S)*13.3),'%',1,21,v=>v<17?'bad':v<19?'warn':''],['co2','CO₂',c=>c.CO2/(airL(S)*.0018),'ppm',0,6000,v=>v>5000?'bad':v>2500?'warn':''],
  ['hum','濕度',c=>c.hum,'%',0,100,()=>''],['T','溫度',c=>c.T,'°C',1,40,()=>''],['waste','排泄物',c=>c.waste,'份',1,20,v=>v>10?'bad':v>5?'warn':''],
  ['mould','霉菌',c=>c.mould,'',1,60,v=>v>20?'bad':v>10?'warn':''],['pnh3','水池氨',c=>{const E=envInfo(S);return E.pool?c.pNH3/(.25*S.V*E.poolSize):0;},'mg/L',2,3,v=>v>1?'bad':v>.5?'warn':'']];
function rangeOf(key){const ans=aliveIn(S,'animal');if(!ans.length)return null;
  return[Math.max(...ans.map(a=>a.params[key+'Min'])),Math.min(...ans.map(a=>a.params[key+'Max']))];}
function renderMeters(){
  const aq=S.mode==='aqua',M=aq?AQ_METERS:RN_METERS.filter(m=>m[0]!=='pnh3'||envInfo(S).pool);
  const hr=!aq&&rangeOf('hum'),tr=rangeOf('t');
  const st=(k,v,f)=>{if(k==='hum'&&hr)return v<hr[0]-5||v>hr[1]+5?'bad':v<hr[0]||v>hr[1]?'warn':'';if(k==='T'&&tr)return v<tr[0]-2||v>tr[1]+2?'bad':v<tr[0]||v>tr[1]?'warn':'';return f(v);};
  $('#meters').innerHTML=M.map(([k,l,g,u,d,mx,f])=>{const v=g(S.c);return`<div class="meter ${st(k,v,f)}"><div class="l">${l}</div><div class="v">${fx(v,d)}<small>${u}</small></div><div class="bar"><span style="width:${clamp(v/mx,0,1)*100}%"></span></div></div>`;}).join('');
  $('#clkDay').textContent=`第 ${S.day} 日`;$('#clkTime').textContent=String(S.hour).padStart(2,'0')+':00';
  const L=isLight(S,S.hour);const lt=$('#lightTag');lt.textContent=L?'開燈':'熄燈';lt.className='tag '+(L?'day':'night');
  $('#wxPill').textContent=`${WX[S.wx].n} · ${fx(S.c.T)}°C${S.wxMode!=='auto'?'（固定）':''}`;
  const an=S.items.filter(i=>i.alive&&CAT[i.type].kind==='animal');
  const stressed=an.filter(i=>i.stress).length;
  const states=M.map(([k,,g,,,,f])=>st(k,g(S.c),f));
  let cls='',txt='穩定';
  if(states.includes('bad')||an.some(i=>i.stress&&i.health<.4)){cls='bad';txt=stressed?`危險 · ${stressed} 隻受壓`:'危險';}
  else if(states.includes('warn')||stressed){cls='warn';txt=stressed?`注意 · ${stressed} 隻受壓`:'注意';}
  if(!an.length&&!S.items.some(i=>i.alive&&CAT[i.type].kind==='plant')){cls='';txt='未有生物';}
  const p=$('#status');p.className='pill '+cls;p.lastChild.textContent=txt;
  $('.hint').textContent=S.sel&&S.sel.alive?`已揀：${label(S.sel)}`:'拖動旋轉 · 撳生物睇參數';
}

function pairRow(l,v,mx,col,u){return`<div class="pair"><span>${l}</span><span class="track"><span style="width:${clamp(v/mx,0,1)*100}%;background:${col}"></span></span><span class="n">${fx(v,1)} ${u}</span></div>`;}
function rangeRow(l,lo,hi,cur,min,max,u){const X=v=>clamp((v-min)/(max-min),0,1)*100;
  return`<div class="pair"><span>${l}</span><span class="track"><span style="margin-left:${X(lo)}%;width:${Math.max(0,X(hi)-X(lo))}%;background:var(--good);opacity:.5"></span><i style="left:calc(${X(cur)}% - 1px)"></i></span><span class="n">${fx(lo,0)}–${fx(hi,0)}${u}</span></div>`;}
function bud(cls,title,right,body,text){return`<div class="bud ${cls}"><div class="bh"><b>${title}</b><span>${right}</span></div>${body}<p>${text}</p></div>`;}
function rate(r,good=1.2,ok=.8){return r>=good?'good':r>=ok?'warn':'bad';}
function budgets(){
  const aq=S.mode==='aqua',c=S.c,V=S.V,L=Math.min(24,S.light),E=envInfo(S),tr=MATS[S.mat].tr;
  const wl=S.wxMode==='auto'?WX.cloudy.light:WX[S.wxMode].light,lm=tr*wl,q=clamp(1+.04*(c.T-25),.5,1.6);
  const P=aliveIn(S,'plant'),A=aliveIn(S,'animal'),M=aliveIn(S,'microbe'),out=[];

  P.forEach(it=>{const p=it.params;o2In+=p.o2Prod*it.health*L*lm*(CAT[it.type].floating?.5:1);const r=p.resp*Math.max(.3,it.health)*q;o2Out+=r*24;hr+=r;});
  A.forEach(it=>{o2Out+=it.params.resp*q*24;hr+=it.params.resp*q;});
  const lightNote=`按 ${L} 小時光照、${MATS[S.mat].n}透光 ${Math.round(tr*100)}%、${S.wxMode==='auto'?'平均天氣':WX[S.wxMode].n}計`;
  if(aq){
    let wIn=0,need=0;A.forEach(it=>{wIn+=it.params.wasteAmt*24/it.params.wasteEvery;need+=it.params.food;});
    const flakeEat=A.reduce((s,it)=>s+(CAT[it.type].diet.flake?it.params.food:0),0);wIn+=Math.max(0,S.feed-flakeEat)*.1;
    const cap=M.filter(i=>i.type==='nitri').reduce((s,i)=>s+i.params.cap*24*i.health*E.surf,0)+(S.filter?.012*V*24:0);
    const upt=P.reduce((s,i)=>s+i.params.uptake*i.health*L,0);
    const nitr=Math.min(wIn,cap);o2Out+=nitr*3.4;hr+=nitr*3.4/24;
    const r=o2Out>0?o2In/o2Out:9,mx=Math.max(o2In,o2Out,1);
    let cls=rate(r,1.2,1),t=r>=1.2?'水草產氧足夠，仲有剩。':r>=1?'產氧同耗氧差唔多，邊緣平衡。':'耗氧多過產氧。';
    if(r<1&&(S.pump||!S.sealed)){cls='warn';t+=S.pump?'靠氧氣泵補充。':'暫時靠開口換氣頂住。';}else if(r<1)t+='密封會慢慢缺氧，加水草、開氧氣泵或者減少動物。';
    if(!P.length&&o2Out>0&&!S.pump){cls=S.sealed?'bad':'warn';t='冇水草'+(S.sealed?'，密封之後氧氣只會一直跌。':'，全靠開口換氣。');}
    out.push(bud(cls,'氧氣（每日）',fx(r,2)+'×',pairRow('產氧',o2In,mx,'var(--o2)','mg')+pairRow('耗氧',o2Out,mx,'var(--muted)','mg'),t+`<br><span class="lede">${lightNote}</span>`));
    const nightUse=hr*(24-L),stock=Math.max(0,c.O2-2*V),pumpAdd=S.pump?(S.sealed?.04:.15)*2*V*(24-L):0;
    const nc=nightUse>stock+pumpAdd?'bad':nightUse>(stock+pumpAdd)*.6?'warn':'good',nm=Math.max(nightUse,stock+pumpAdd,1);
    out.push(bud(nc,`熄燈 ${24-L} 小時`,`${fx(nightUse)} / ${fx(stock+pumpAdd)} mg`,pairRow('夜晚用',nightUse,nm,'var(--muted)','mg')+pairRow('可用',stock+pumpAdd,nm,'var(--o2)','mg'),
      nc==='good'?'存量夠撐到天光。':nc==='warn'?'天光前溶氧會跌得幾低，留意敏感嘅蝦。':'夜晚會缺氧！開氧氣泵、縮短熄燈時間或者減少動物。'));
    if(wIn>0){const r2=(cap+upt)/wIn,m2=Math.max(wIn,cap+upt,.01);
      out.push(bud(rate(r2),'排泄物（氨，每日）',fx(r2,2)+'×',pairRow('產生',wIn,m2,'var(--warn)','mg')+pairRow('處理',cap+upt,m2,'var(--leaf)','mg'),
        (r2>=1.2?'硝化菌同水草處理得切。':r2>=.8?'啱啱好，餵多咗就會累積氨。':'氨會累積，加硝化菌、底沙、石頭或者開過濾。')+`<br><span class="lede">細菌附著面 ×${fx(E.surf,2)}${S.filter?'，過濾器幫手':''}</span>`));}
    if(need>0){const algaeDay=S.hist.slice(-24).reduce((s,h)=>s+(h.grown||0),0),sup=S.feed+algaeDay+c.detritus*.1,r3=sup/need,m3=Math.max(need,sup,.1);
      out.push(bud(rate(r3),'食物（每日）',fx(r3,2)+'×',pairRow('需要',need,m3,'var(--muted)','份')+pairRow('供應',sup,m3,'var(--accent)','份'),
        r3>=1.2?'食物夠。':r3>=.8?'食物勉強夠。':'食物唔夠，增加餵食，或者揀食藻嘅蝦同螺。'));}
    const tr2=rangeOf('t');if(tr2){const ok=c.T>=tr2[0]&&c.T<=tr2[1],bad=tr2[0]>tr2[1];
      out.push(bud(bad?'bad':ok?'good':'warn','水溫',`${fx(c.T)}°C`,rangeRow('啱溫',tr2[0],tr2[1],c.T,0,40,'°C'),
        bad?'瓶入面啲動物冇一個共同啱嘅溫度，要揀過啲生物。':ok?'水溫喺全部動物都舒服嘅範圍。':'水溫出咗範圍，受天氣影響，可以搬去室內或者改天氣。'));}
  } else {

      (S.sealed?(r>=1.1?'密封都得：植物食走嘅二氧化碳多過動物呼出嘅。':'密封會令二氧化碳不斷上升，要開網蓋通風或加植物。'):'開咗口，空氣會自然交換。')+`<br><span class="lede">${lightNote}</span>`));

        r2>=1.2?'分解者處理得切。':'排泄物會堆積、生霉，加土壤菌群、鼠婦或者泥土。'));}

    const hr2=rangeOf('hum');if(hr2){const ok=c.hum>=hr2[0]&&c.hum<=hr2[1],bad=hr2[0]>hr2[1];

        bad?'動物之間冇共同啱嘅濕度，例如守宮怕太濕、箭毒蛙要好濕。':ok?'濕度啱晒。':c.hum<hr2[0]?'太乾：加噴霧次數、密封或者加水池。':'太濕：打開網蓋通風、減噴霧或者開加熱燈。'));}

    if(A.some(i=>CAT[i.type].pool)&&!E.pool)out.push(bud('bad','水池','冇','','麝香龜一定要有水池，去「加入 › 造景」加一個。'));
  }
  return out;
}
function renderBalance(){
  const aq=S.mode==='aqua',items=budgets(),fc=forecast(72);
  const bads=items.filter(x=>x.includes('bud bad')).length+(fc.deaths.length?1:0),warns=items.filter(x=>x.includes('bud warn')).length;
  const anyLife=S.items.some(i=>i.alive&&['plant','animal'].includes(CAT[i.type].kind));
  let vt,vb;
  if(!anyLife){vt='未有生物';vb='去「加入」由造景開始砌，再放植物同動物。';}
  else if(!bads&&!warns){vt=S.sealed?'可以長期密封自給自足':'生態平衡';vb='氧氣、排泄物同食物循環都閉合得到。';}
  else if(!bads){vt='基本平衡，有啲邊緣';vb='可以運作，但留意黃色項目。';}
  else{vt='未能自給自足';vb=`有 ${bads} 項唔平衡。可以跟住紅色項目調整，或者撳「一鍵平衡」。`;}
  const reasons=Object.entries(fc.stress).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([r,n])=>`${r}（${n} 隻·小時）`).join('、');
  const fcTxt=aq?`溶氧最低 ${fx(fc.mn.o2)} mg/L，氨最高 ${fx(fc.mx.nh3,2)} mg/L，水溫 ${fx(fc.mn.T)}–${fx(fc.mx.T)}°C`
    :`O₂ 最低 ${fx(fc.mn.o2)}%，CO₂ 最高 ${fx(fc.mx.co2,0)} ppm，濕度 ${fx(fc.mn.hum,0)}–${fx(fc.mx.hum,0)}%，溫度 ${fx(fc.mn.T)}–${fx(fc.mx.T)}°C，霉菌最高 ${fx(fc.mx.mould)}`;
  const R=S.report;
  $('#pane-bal').innerHTML=`${R?`<div class="report"><b>一鍵平衡結果</b>${R.changes.length?`<ul>${R.changes.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="lede">而家嘅設定已經係最平衡，冇需要改。</p>'}
      <p class="lede" style="margin-top:6px">${R.ok?'模擬未來 5 日：冇生物死亡。':'模擬未來 5 日仍然有生物頂唔順，可能要移走部份動物。'}水質已重設、生物已回復健康。生物本身嘅參數（食量、耗氧）係佢哋嘅天性，所以只調環境同組合。</p></div>`:''}
    <div class="verdict"><div><b>${vt}</b>${vb}</div><button class="btn magic" id="balBtn2" style="align-self:flex-start">一鍵平衡</button></div>
    <div class="bud ${fc.deaths.length?'bad':reasons?'warn':'good'}"><div class="bh"><b>預測未來 3 日</b><span>${S.wxMode==='auto'?'以多雲天氣':WX[S.wxMode].n}</span></div>
      <p>${fc.deaths.length?`會有 ${fc.deaths.length} 個生物死亡：${[...new Set(fc.deaths.map(d=>CAT[d.type].name+'（'+d.why+'）'))].join('、')}。`:'冇生物會死。'}${reasons?`受壓原因：${reasons}。`:''}<br><span class="lede">${fcTxt}</span></p></div>
    <div class="budget">${items.join('')}</div>
    <div class="chartbox"><h3>走勢（最近 ${Math.min(S.hist.length,168)} 小時）</h3><canvas id="chart"></canvas>
    <div class="legend">${aq?'<span><i style="background:var(--o2)"></i>溶氧 mg/L（左）</span><span><i style="background:var(--warn)"></i>氨 mg/L（右）</span>':'<span><i style="background:var(--o2)"></i>濕度 %（左）</span><span><i style="background:var(--warn)"></i>溫度 °C（右）</span>'}<span><i style="background:var(--line);height:8px"></i>夜間</span></div></div>
    <section><h3 style="margin-bottom:6px">事件紀錄</h3>${S.log.length?`<ul class="log">${S.log.slice(0,16).map(l=>`<li><span class="tm">第${l.d}日 ${String(l.h).padStart(2,'0')}:00</span><span style="color:var(--${l.c==='muted'?'muted':l.c})">${esc(l.t)}</span></li>`).join('')}</ul>`:'<p class="lede">暫時冇事發生。</p>'}</section>`;
  $('#balBtn2').onclick=()=>$('#balBtn').click();
  drawChart();
}
function drawChart(){
  const cv=$('#chart');if(!cv)return;const w=cv.clientWidth,h=170,dpr=Math.min(devicePixelRatio,2);cv.width=w*dpr;cv.height=h*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);const cs=getComputedStyle(document.documentElement);const col=k=>cs.getPropertyValue(k).trim();
  const H=S.hist.slice(-168),pl=30,pr=34,pt=8,pb=18,iw=w-pl-pr,ih=h-pt-pb;
  x.font='10px '+col('--f-mono');x.fillStyle=col('--muted');
  if(H.length<2){x.fillText('模擬緊，等一陣…',pl,h/2);return;}
  const aq=S.mode==='aqua';
  const k1=aq?'o2':'hum',max1=aq?14:100,ticks1=aq?[0,4,8,12]:[0,25,50,75,100];
  const k2=aq?'nh3':'T',max2=aq?Math.max(1,Math.ceil(Math.max(...H.map(p=>p.nh3||0))*2)/2):40;
  const X=i=>pl+i/(H.length-1)*iw,Y1=v=>pt+ih-clamp(v/max1,0,1)*ih,Y2=v=>pt+ih-clamp(v/max2,0,1)*ih;
  x.fillStyle=col('--line');x.globalAlpha=.5;H.forEach((p,i)=>{if(!p.light)x.fillRect(X(i)-iw/(H.length-1)/2,pt,iw/(H.length-1)+.5,ih);});x.globalAlpha=1;
  x.strokeStyle=col('--line');x.lineWidth=1;x.fillStyle=col('--muted');x.textAlign='right';
  ticks1.forEach(v=>{x.beginPath();x.moveTo(pl,Y1(v));x.lineTo(pl+iw,Y1(v));x.stroke();x.fillText(v,pl-5,Y1(v)+3);});
  x.textAlign='left';[0,max2/2,max2].forEach(v=>x.fillText(fx(v,aq?2:0),pl+iw+5,Y2(v)+3));
  if(aq){x.strokeStyle=col('--bad');x.setLineDash([3,3]);x.beginPath();x.moveTo(pl,Y1(3));x.lineTo(pl+iw,Y1(3));x.stroke();x.setLineDash([]);}
  const line=(k,Y,c)=>{x.strokeStyle=c;x.lineWidth=2;x.beginPath();H.forEach((p,i)=>i?x.lineTo(X(i),Y(p[k]||0)):x.moveTo(X(i),Y(p[k]||0)));x.stroke();
    const l=H[H.length-1];x.fillStyle=c;x.beginPath();x.arc(X(H.length-1),Y(l[k]||0),3,0,7);x.fill();};
  line(k1,Y1,col('--o2'));line(k2,Y2,col('--warn'));
  x.fillStyle=col('--muted');x.textAlign='center';x.fillText(`${H.length} 小時前`,pl+30,h-4);x.fillText('而家',pl+iw-10,h-4);
}

function loadPreset(key){
  const p=PRESETS[S.mode][key];S.items.forEach(i=>disposeObj(i.g));S.items=[];S.sel=null;S.uid=1;S.report=null;
  Object.assign(S,{V:p.V,shape:p.shape,mat:p.mat||'glass',sealed:p.sealed,light:p.light,feed:p.feed,pump:!!p.pump,filter:!!p.filter,mist:p.mist||0,heat:!!p.heat,log:[],hour:6,day:1});
  resetChem(S);
  p.items.forEach(([t,n,par])=>{for(let i=0;i<n;i++){const it=makeItem(t,par);it.n=nextN(t);S.items.push(it);}});
  buildJar();renderAll();save();toast('已載入：'+p.n);
}
function shapeIcon(k){const sh=SHAPES[k];
  if(sh.box)return`<svg viewBox="0 0 40 50" aria-hidden="true"><rect x="5" y="${46-sh.H/2.7*40}" width="30" height="${sh.H/2.7*40}" rx="1"/></svg>`;
  const pts=shapeSamples(sh).map(p=>[p.x*sh.R*14,46-p.y*sh.H/2.7*40]);
  const d='M'+pts.map(([x,y])=>`${(20+x).toFixed(1)} ${y.toFixed(1)}`).join('L')+'L'+[...pts].reverse().map(([x,y])=>`${(20-x).toFixed(1)} ${y.toFixed(1)}`).join('L')+'Z';
  return`<svg viewBox="0 0 40 50" aria-hidden="true"><path d="${d}"/></svg>`;}
const matHex=k=>'#'+MATS[k].c.toString(16).padStart(6,'0');
function renderEnv(){
  const aq=S.mode==='aqua';
  const sw=(id,on,t,d)=>`<label class="switch" for="${id}"><span><b>${t}</b><br><span class="lede">${d}</span></span><input type="checkbox" id="${id}" ${on?'checked':''}></label>`;
  const sl=(id,l,v,min,max,step,u,h)=>`<div class="field param"><div class="ph"><label for="${id}">${l}</label><output id="o${id}">${v} ${u}</output></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}"><small>${h}</small></div>`;
  $('#pane-env').innerHTML=`
   <section class="field"><h3>天氣</h3><div class="opts">${[['auto','自動'],...Object.entries(WX).map(([k,w])=>[k,w.n])].map(([k,n])=>`<button class="opt" data-wx="${k}" aria-pressed="${S.wxMode===k}"><span>${n}</span></button>`).join('')}</div>
     <small class="lede">個瓶放喺窗邊：天氣會改變光照同溫度。${aq?'開口時落雨會沖淡水入面嘅氨。':'開口時落雨同起霧會令濕度上升。'}雷暴會閃電。</small></section>
   <section class="field"><h3>瓶形狀</h3><div class="opts">${Object.entries(SHAPES).map(([k,sh])=>`<button class="opt" data-shape="${k}" aria-pressed="${S.shape===k}">${shapeIcon(k)}<span>${sh.n}</span></button>`).join('')}</div>
     <small class="lede">開口越窄，打開蓋時換氣越慢。而家開口換氣效率：${Math.round(J.open*100)}%</small></section>
   <section class="field"><h3>瓶材質</h3><div class="opts">${Object.entries(MATS).map(([k,m])=>`<button class="opt" data-mat="${k}" aria-pressed="${S.mat===k}"><i class="sw" style="background:${matHex(k)};opacity:${Math.min(1,m.op*2.5+.3)}"></i><span>${m.n}</span><em>透光 ${Math.round(m.tr*100)}%</em></button>`).join('')}</div>
     <small class="lede">${MATS[S.mat].n}：${MATS[S.mat].d}。透光率會直接乘落光合作用。</small></section>
   ${sl('e-V','瓶容量',S.V,1,30,1,'L','越大越穩定，變化越慢。')}
   ${sl('e-L','每日光照',S.light,0,24,1,'小時','朝早 7 點開燈。光照長產氧多，但藻類都長得快。')}
   ${sl('e-F','每日餵食',S.feed,0,6,.5,'份',aq?'每朝 9 點落飼料，食唔晒會腐爛變氨。':'每朝 9 點放昆蟲或飼料，食唔晒會變排泄物。')}
   ${aq?sw('e-P',S.pump,'氧氣泵','打氣入水，補氧同趕走 CO₂。密封時效果細啲。')+sw('e-Fi',S.filter,'過濾','海綿入面住咗大量硝化菌，分解氨同隔走殘渣。')
     :sl('e-M','每日噴霧',S.mist,0,6,1,'次','每次噴霧即刻提高濕度。')+sw('e-H',S.heat,'加熱燈','開燈時加熱約 5°C，同時令空氣乾啲。')+(envInfo(S).pool?sw('e-Fi',S.filter,'水池過濾','清走龜嘅排泄物，水池保持乾淨。'):'')}
   ${sw('e-S',S.sealed,aq?'密封瓶口':'密封（唔用網蓋）',aq?'密封＝完全靠瓶內循環；開口＝空氣會補氧。':'密封＝濕度高、空氣唔流通；網蓋＝通風、濕度跟天氣。')}
   <section class="presets"><h3>預設組合（${aq?'水族':'雨林'}）</h3>${Object.entries(PRESETS[S.mode]).map(([k,p])=>`<button class="preset" data-p="${k}"><b>${p.n}</b><span>${p.d}</span></button>`).join('')}</section>
   <div class="ed-actions"><button class="btn" id="e-restart">保留生物，重新開始時間</button><button class="btn danger" id="e-clear">清空個瓶</button></div>`;
  const bind=(id,f,u)=>{const e=$('#'+id);if(!e)return;e.oninput=()=>{$('#o'+id).textContent=e.value+' '+u;f(+e.value,false);save();};e.onchange=()=>f(+e.value,true);};
  bind('e-V',(v,done)=>{if(!done)return;const r=v/S.V;['O2','CO2','NH3','NO3','waste','pNH3'].forEach(k=>{if(S.c[k]!=null)S.c[k]*=r;});S.V=v;buildJar();renderEnv();},'L');
  bind('e-L',v=>S.light=v,'小時');bind('e-F',v=>S.feed=v,'份');bind('e-M',v=>S.mist=v,'次');
  const chk=(id,k)=>{const e=$('#'+id);if(e)e.onchange=()=>{S[k]=e.checked;save();};};
  chk('e-P','pump');chk('e-Fi','filter');chk('e-H','heat');chk('e-S','sealed');
  const pe=$('#pane-env');
  pe.querySelectorAll('[data-wx]').forEach(b=>b.onclick=()=>{S.wxMode=b.dataset.wx;if(S.wxMode!=='auto')S.wx=S.wxMode;renderEnv();save();toast(S.wxMode==='auto'?'天氣自動變化':'天氣固定為'+WX[S.wx].n);});
  pe.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{S.shape=b.dataset.shape;buildJar();renderEnv();renderJarList();renderEditor();save();toast('換咗做'+SHAPES[S.shape].n);});
  pe.querySelectorAll('[data-mat]').forEach(b=>b.onclick=()=>{S.mat=b.dataset.mat;buildJar();renderEnv();save();toast('換咗做'+MATS[S.mat].n);});
  pe.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>loadPreset(b.dataset.p));
  $('#e-restart').onclick=()=>{resetChem(S);S.hour=6;S.day=1;S.log=[];S.items=S.items.filter(i=>{if(!i.alive){disposeObj(i.g);return false;}return true;});S.items.forEach(i=>{i.health=1;i.satiety=1;});renderAll();toast('時間重新開始');};
  $('#e-clear').onclick=()=>{S.items.forEach(i=>disposeObj(i.g));S.items=[];S.sel=null;S.report=null;resetChem(S);buildJar();renderAll();save();toast('已清空');};
}
function renderAll(){renderModeSeg();renderCatalog();renderJarList();renderEditor();renderEnv();renderMeters();if(curTab==='bal')renderBalance();}

/* ================= 儲存 ================= */
const KEY='ecojar.v2';
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({mode:S.mode,V:S.V,shape:S.shape,mat:S.mat,sealed:S.sealed,light:S.light,feed:S.feed,pump:S.pump,filter:S.filter,mist:S.mist,heat:S.heat,wxMode:S.wxMode,
  items:S.items.filter(i=>i.alive).map(i=>[i.type,i.params,i.name||''])}));}catch(e){}},400);}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d||!d.items||!PRESETS[d.mode])return false;
  Object.assign(S,{mode:d.mode,V:d.V,shape:SHAPES[d.shape]?d.shape:'jar',mat:MATS[d.mat]?d.mat:'glass',sealed:!!d.sealed,light:d.light,feed:d.feed,pump:!!d.pump,filter:!!d.filter,mist:d.mist||0,heat:!!d.heat,wxMode:d.wxMode||'auto'});
  if(S.wxMode!=='auto'&&WX[S.wxMode])S.wx=S.wxMode;
  resetChem(S);d.items.forEach(([t,p,nm])=>{if(!CAT[t])return;const it=makeItem(t,p);it.n=nextN(t);it.name=nm||'';S.items.push(it);});return true;}catch(e){return false;}}

/* ================= 開始 ================= */
renderSpeed();
if(!load()){const p=PRESETS.aqua.eco;Object.assign(S,{V:p.V,shape:p.shape,sealed:p.sealed,light:p.light,feed:p.feed});resetChem(S);
  p.items.forEach(([t,n])=>{for(let i=0;i<n;i++){const it=makeItem(t);it.n=nextN(t);S.items.push(it);}});}
buildJar();renderAll();resize();
let last=performance.now(),acc=0,lastUI=0,lastBal=0;
function frame(t){
  const dt=Math.min(.1,(t-last)/1000);last=t;
  if(S.running){acc+=dt*S.speed;let n=0;while(acc>=1&&n<60){step(S);acc-=1;n++;}}
  animate(dt,S.hour+(S.running?acc:0));
  renderer.render(scene,camera);
  if(t-lastUI>250){lastUI=t;renderMeters();if(dirtyList){renderJarList();renderCatalog();if(S.sel&&!S.items.includes(S.sel)){S.sel=null;renderEditor();}}else updateJarLive();
    if(curTab==='bal'&&t-lastBal>2500&&!document.activeElement?.closest?.('#pane-bal')){lastBal=t;renderBalance();}}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</html>
