<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Eco Jar Lab 生態瓶實驗室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='21' y='3' width='22' height='9' rx='2' fill='%23a77a4c'/%3E%3Cpath d='M23 12h18v6c8 4 13 11 13 20 0 13-10 22-22 22S10 51 10 38c0-9 5-16 13-20z' fill='%23e6f3f6' stroke='%230f716b' stroke-width='3'/%3E%3Cpath d='M12.6 34h38.8c.4 1.3.6 2.6.6 4 0 12-9 19-20 19s-20-7-20-19c0-1.4.2-2.7.6-4z' fill='%236cc3c9'/%3E%3Cpath d='M29 55c-2-7 0-13 4-17M35 55c3-4 3-9 1-14' stroke='%233f7d22' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='42' cy='26' r='2.5' fill='%23fff' stroke='%230f716b' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif:wght@600;700&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+Mono:wght@400;500&display=swap">
<style>

/* Layout: one-screen lab bench — live 3D jar on the left, specimen sheet (catalog / contents / budget / environment) on the right; stacks on phones */
:root{
  --bg:#edf3f2; --surface:#ffffff; --surface-2:#f4f8f7; --ink:#10262b; --muted:#566f74; --line:#d3dfde;
  --accent:#0f716b; --accent-soft:#d7ebe8; --on-accent:#ffffff;
  --leaf:#4a8628; --o2:#2672ad; --warn:#a4660f; --bad:#bf3828; --good:#2b7f52;
  --glass:rgba(255,255,255,.82);
  --f-display:"Noto Serif","Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"Noto Sans Mono","Noto Sans TC",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1517; --surface:#112022; --surface-2:#0e1b1d; --ink:#e1eeec; --muted:#8fa8a7; --line:#223739;
  --accent:#46b8ac; --accent-soft:#163533; --on-accent:#05211e;
  --leaf:#8cc152; --o2:#6db3e8; --warn:#e2a84c; --bad:#f06c5c; --good:#5cc28b;
  --glass:rgba(12,24,26,.8); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1517; --surface:#112022; --surface-2:#0e1b1d; --ink:#e1eeec; --muted:#8fa8a7; --line:#223739;
  --accent:#46b8ac; --accent-soft:#163533; --on-accent:#05211e;
  --leaf:#8cc152; --o2:#6db3e8; --warn:#e2a84c; --bad:#f06c5c; --good:#5cc28b;
  --glass:rgba(12,24,26,.8); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;flex-direction:column;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.08em}
.clock{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;margin-right:auto;flex-wrap:wrap}
.clock b{font-weight:500;font-size:15px}
.tag{font-family:var(--f-body);font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.tag.day{color:var(--warn)} .tag.night{color:var(--o2)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.build{border-color:#b08a5a;color:#8a6232;font-weight:700}
.btn.build.on{background:#b08a5a;color:#fff}
.btn.magic{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.danger{color:var(--bad)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.seg.mode button{font-size:13px;padding:6px 14px}

.main{display:flex;flex-direction:column;gap:12px}
.stage{position:relative;height:56vh;min-height:320px;border-radius:14px;overflow:hidden;background:#0f1d22;border:1px solid var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:4}
.hud-l{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);display:flex;gap:6px;align-items:center;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.pill.warn i{background:var(--warn)} .pill.bad i{background:var(--bad)}
.pill.wx{font-weight:500}
.hint{font-size:11px;color:var(--muted);background:var(--glass);padding:3px 9px;border-radius:99px;border:1px solid var(--line)}
.meters{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px;pointer-events:none}
.meter{background:var(--glass);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:5px 9px;min-width:0}
.meter .l{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500}
.meter .v small{font-size:10px;color:var(--muted);margin-left:2px}
.meter .bar{height:3px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden}
.meter .bar span{display:block;height:100%;background:var(--good)}
.meter.warn .v{color:var(--warn)} .meter.warn .bar span{background:var(--warn)}
.meter.bad .v{color:var(--bad)} .meter.bad .bar span{background:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 10px 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.pane{padding:14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0}
.pane h2{font-family:var(--f-display);font-size:16px;margin:0}
.pane h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.lede{color:var(--muted);font-size:12.5px;margin:0}

.cards{display:grid;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;background:var(--surface-2)}
.card .nm{font-weight:700;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.card .nm em{font-weight:400;font-size:11px;color:var(--muted)}
.card p{margin:0;font-size:12.5px;color:var(--muted);grid-column:1/2}
.ctr{grid-row:1/3;grid-column:2;align-self:center;display:flex;align-items:center;gap:4px}
.ctr button{width:34px;height:34px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-size:18px;line-height:1}
.ctr button.minus{background:var(--surface);color:var(--accent)}
.ctr button:disabled{opacity:.35;cursor:default}
.ctr output{min-width:22px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:4px;grid-column:1/-1}
.chip{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) 80px;align-items:center;gap:10px;padding:8px 12px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--accent-soft)}
.row .t{display:flex;flex-direction:column;min-width:0}
.row .t span{font-size:11.5px;color:var(--muted)}
.row .t span.warn{color:var(--warn)} .row .t span.bad{color:var(--bad)}
.hbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.hbar span{display:block;height:100%;background:var(--good)}
.hbar.warn span{background:var(--warn)} .hbar.bad span{background:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:13px;text-align:center}

.editor{border:1px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.ed-head{display:flex;align-items:center;gap:8px}
.ed-head h2{margin-right:auto}
.x{border:0;background:none;font-size:18px;color:var(--muted);width:30px;height:30px;border-radius:6px}
.vitals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vital{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.vital b{color:var(--ink);font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.param{display:flex;flex-direction:column;gap:3px}
.param .ph{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.param .ph output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.param small{color:var(--muted);font-size:11.5px}
input[type=range]{width:100%;accent-color:var(--accent)}
.ed-actions{display:flex;flex-wrap:wrap;gap:8px}

.budget{display:flex;flex-direction:column;gap:10px}
.bud{display:flex;flex-direction:column;gap:5px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.bud .bh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bud .bh b{font-size:13px}
.bud .bh span{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:52px minmax(0,1fr) 84px;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.pair .track{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.pair .track span{display:block;height:100%}
.pair .track i{position:absolute;top:-2px;bottom:-2px;width:3px;border-radius:2px;background:var(--ink)}
.pair .n{font-family:var(--f-mono);text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.bud p{margin:0;font-size:12.5px}
.bud.good{border-left:4px solid var(--good)} .bud.warn{border-left:4px solid var(--warn)} .bud.bad{border-left:4px solid var(--bad)}
.verdict{padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.verdict b{font-family:var(--f-display);font-size:16px;display:block}
.report{border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:13px}
.report summary{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;list-style:none}
.report summary::-webkit-details-marker{display:none}
.report summary span{flex:1;min-width:0}
.report summary::before{content:'▸';color:var(--muted);transition:transform .15s}
.report[open] summary{margin-bottom:6px}
.report[open] summary::before{transform:rotate(90deg)}
.report:not([open]){padding-block:6px}
.compactnote{padding:6px 2px}
.report ul{margin:6px 0 0;padding-left:18px}
.chartbox{border:1px solid var(--line);border-radius:10px;padding:10px}
.chartbox canvas{width:100%;height:170px;display:block}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.log{list-style:none;margin:0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.log li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}
.log .tm{font-family:var(--f-mono);color:var(--muted);font-size:11.5px}

.field{display:flex;flex-direction:column;gap:4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.switch input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.presets{display:grid;gap:8px}
.preset{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.preset:hover{border-color:var(--accent)}
.preset b{display:block}
.preset span{font-size:12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;margin-top:6px}
.opt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:12px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.opt svg{width:32px;height:40px;fill:color-mix(in srgb,var(--o2) 18%,transparent);stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.opt .sw{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:block;margin:4px 0}
.opt em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:400;font-family:var(--f-mono)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1}


.jars{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.jars button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jars button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.btn.lang{font-family:var(--f-mono);font-weight:500;min-width:52px}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
.clearbtn{pointer-events:auto;font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--bad);backdrop-filter:blur(6px)}
.clearbtn.arm{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.hint{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctr button.wide{width:auto;padding:0 12px;font-size:13px}
.namerow{display:flex;gap:6px}
.namerow input,.txt{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.field>label{font-size:13px}
.ana-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ana-grid label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.ana-grid input,.ana-grid select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;color:var(--ink);font-size:13px}
.spp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.sp{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;min-width:0}
.sp>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp input{width:54px;flex:none;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:center}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;gap:5px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.checks input{accent-color:var(--accent)}
.anaout{display:flex;flex-direction:column;gap:10px}
.issue{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:10px 12px}
.issue.bad{border-left-color:var(--bad)} .issue.warn{border-left-color:var(--warn)} .issue.good{border-left-color:var(--good)}
.issue .bh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.issue p{margin:4px 0 0;font-size:12.5px}
.issue ol{margin:6px 0 0;padding-left:18px;font-size:12.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;font-size:12.5px;align-items:center}
.src{font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.hud-rr{display:flex;gap:6px}
.pill.click{pointer-events:auto;cursor:pointer;color:var(--ink);font:inherit;font-size:12px;font-weight:700}
.tglbtn{pointer-events:auto;cursor:pointer;font-size:11.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(6px);color:var(--muted)}
.tglbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.ov{position:absolute;top:84px;bottom:var(--mh,120px);width:200px;overflow:auto;display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:12px;background:var(--glass);backdrop-filter:blur(6px);border:1px solid var(--line);font-size:12px;z-index:2}
.ovL{left:10px;width:min(360px,42%);padding:0;gap:0}
.ovR{right:10px}
.ovhead{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px;background:var(--glass);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ovhead h4{margin:0}
.ovbody{padding:10px;display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.ovbody .verdict{font-size:12.5px;padding:10px}
.ovbody .verdict b{font-size:14.5px}
.ovbody .bud{padding:8px 10px;background:var(--surface)}
.ovbody .chartbox{background:var(--surface)}
.ovbody .chartbox canvas{height:140px}
.ovbody .report{background:var(--surface)}
.ov h4{margin:0 0 4px;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.ovnote{margin:0;color:var(--muted)}
.ovrow{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:3px 6px;align-items:center;border:0;background:none;padding:4px;text-align:left;border-radius:6px;width:100%;font-size:12px;color:var(--ink)}
.ovrow:hover,.ovrow.on{background:var(--accent-soft)}
.ovrow i{width:8px;height:8px;border-radius:50%;background:var(--good)} .ovrow i.warn{background:var(--warn)} .ovrow i.bad{background:var(--bad)}
.ovrow>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

<script>
(()=>{
/* ================= 工具 & 語言 ================= */
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fx=(x,d=1)=>(Math.abs(x)<1e-9||!isFinite(x)?0:x).toFixed(d);
const rnd=(a,b)=>a+Math.random()*(b-a);
const esc=t=>String(t).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
let LANG='zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const N=x=>Array.isArray(x)?(LANG==='en'?x[1]:x[0]):x;
const P=(l,u,min,max,step,h)=>({l,u,min,max,step,h:h||['','']});

/* ================= 參數定義 ================= */
const PD={
  o2Prod:P(['光照時產氧','O₂ made in light'],['mg/小時','mg/h'],0,3,.05,['開燈時每小時製造幾多氧氣','Oxygen produced each hour while lit']),
  respP:P(['呼吸耗氧','Respiration'],['mg/小時','mg/h'],0,.5,.01,['日夜都要呼吸，夜晚只用氧唔產氧','Plants breathe day and night; at night they only use oxygen']),
  uptake:P(['吸收養分','Nutrient uptake'],['mg/小時','mg/h'],0,.05,.001,['吸收氨同硝酸鹽，即係動物排泄物分解出嚟嘅嘢','Absorbs ammonia and nitrate from animal waste']),
  respA:P(['呼吸耗氧','Respiration'],['mg/小時','mg/h'],0,.5,.005,['25°C 時每小時用幾多氧；越暖用得越多','Oxygen used per hour at 25°C; more when warmer']),
  food:P(['每日食量','Daily food'],['份/日','portions/day'],0,3,.1,['1 份 ≈ 一撮飼料；冇得食會慢慢餓','1 portion ≈ a pinch of food; goes hungry without it']),
  wasteEvery:P(['幾耐去一次廁所','Poops every'],['小時','h'],1,48,1,['排泄嘅時間間隔','Time between droppings']),
  wasteAmt:P(['每次排泄量','Waste per dropping'],['mg 氨','mg NH₃'],0,.4,.005,['一半即刻變氨，一半變殘渣慢慢分解','Half turns to ammonia at once, half to detritus that breaks down slowly']),
  o2Min:P(['最少要幾多氧','Minimum oxygen'],['mg/L','mg/L'],.5,8,.1,['溶氧低過呢個數就會缺氧','Below this it suffocates']),
  nh3Tol:P(['氨耐受上限','Ammonia limit'],['mg/L','mg/L'],.05,3,.05,['氨濃度高過呢個數就會中毒','Above this it is poisoned']),
  tMin:P(['最低溫度','Min temperature'],['°C','°C'],0,35,1,['低過呢個溫度會凍親','Colder than this is harmful']),
  tMax:P(['最高溫度','Max temperature'],['°C','°C'],5,40,1,['高過呢個溫度會熱親','Warmer than this is harmful']),
  breedDays:P(['幾多日生一次','Breeds every'],['日','days'],0,60,1,['0 = 唔會繁殖；要健康、食得飽、有伴先會生','0 = never; needs good health, food and a partner']),
  litter:P(['每次生幾多隻','Young per brood'],['隻','young'],1,6,1),
  cap:P(['分解氨能力','Ammonia processing'],['mg/小時','mg/h'],0,.3,.005,['每小時最多將幾多氨變成硝酸鹽；底沙同石頭越多，細菌住得越多','Max ammonia turned into nitrate per hour; more substrate and rock hold more bacteria']),
  o2PerN:P(['分解耗氧','Oxygen used'],['mg 氧/mg 氨','mg O₂ per mg NH₃'],0,6,.1,['每分解 1 mg 氨要用幾多氧','Oxygen used per mg of ammonia']),
  rate:P(['分解速度','Breakdown rate'],['份/小時','portions/h'],0,.5,.01,['每小時分解幾多殘渣或者排泄物','How much detritus or waste is broken down per hour']),
  o2Per:P(['分解耗氧','Oxygen used'],['mg/份','mg per portion'],0,5,.05),
  o2ProdL:P(['光照時產氧','O₂ made in light'],['mg/小時','mg/h'],0,5,.1,['開燈時製造氧氣，同時食走二氧化碳','Makes oxygen and removes CO₂ while lit']),
  respPL:P(['呼吸耗氧','Respiration'],['mg/小時','mg/h'],0,1,.01),
  uptakeL:P(['吸收養分','Nutrient uptake'],['份/小時','portions/h'],0,.1,.002,['吸收泥土入面分解咗嘅排泄物','Takes up broken-down waste from the soil']),
  transp:P(['蒸散加濕','Transpiration'],['%/小時','%/h'],0,2,.05,['葉子散出水汽，提高濕度','Leaves release water vapour and raise humidity']),
  humMinP:P(['最低濕度','Min humidity'],['%','%'],0,100,1,['低過呢個濕度葉子會乾','Leaves dry out below this']),
  respL:P(['呼吸耗氧','Respiration'],['mg/小時','mg/h'],0,8,.1,['密封瓶入面會令二氧化碳上升','Raises CO₂ in a sealed jar']),
  wasteL:P(['每次排泄量','Waste per dropping'],['份','portions'],0,2,.05,['排泄物落喺泥土上，靠分解者處理','Droppings land on the soil for decomposers']),
  humMin:P(['最低濕度','Min humidity'],['%','%'],0,100,1),
  humMax:P(['最高濕度','Max humidity'],['%','%'],0,100,1,['長期太濕會生病','Too humid for long makes it ill']),
  nh3TolW:P(['水中氨耐受','Water ammonia limit'],['mg/L','mg/L'],.1,3,.05,['水區入面氨高過呢個數會生病','Above this in the water it gets ill']),
  x:P(['左右位置','Left–right'],['',''],-1,1,.05,['亦可以喺 3D 畫面直接拖','You can also drag it in the 3D view']),
  z:P(['前後位置','Front–back'],['',''],-1,1,.05),
  rot:P(['左右轉','Turn'],['°','°'],0,360,5,['繞住垂直軸轉一圈','Spin around the vertical axis']),
  rotX:P(['前後傾','Tilt front–back'],['°','°'],-180,180,5,['向前或者向後翻','Tip it forwards or backwards']),
  rotZ:P(['左右傾','Tilt left–right'],['°','°'],-180,180,5,['向左或者向右側','Tip it to the left or right']),
  size:P(['大細','Size'],['×','×'],.4,2,.05),
  depth:P(['厚度','Thickness'],['cm','cm'],1,8,.5,['越厚越多細菌住，但會佔空間','Thicker holds more bacteria but takes space'])
};
/* group → [param key, def key] */
const GROUPS={
  aplant:[['o2Prod','o2Prod'],['resp','respP'],['uptake','uptake']],
  aanimal:[['resp','respA'],['food','food'],['wasteEvery','wasteEvery'],['wasteAmt','wasteAmt'],['o2Min','o2Min'],['nh3Tol','nh3Tol'],['tMin','tMin'],['tMax','tMax'],['breedDays','breedDays'],['litter','litter']],
  nitri:[['cap','cap'],['o2PerN','o2PerN']],
  decomp:[['rate','rate'],['o2Per','o2Per']],
  rplant:[['o2Prod','o2ProdL'],['resp','respPL'],['uptake','uptakeL'],['transp','transp'],['humMin','humMinP']],
  ranimal:[['resp','respL'],['food','food'],['wasteEvery','wasteEvery'],['wasteAmt','wasteL'],['humMin','humMin'],['humMax','humMax'],['tMin','tMin'],['tMax','tMax'],['breedDays','breedDays'],['litter','litter']],
  amph:[['resp','respL'],['food','food'],['wasteEvery','wasteEvery'],['wasteAmt','wasteL'],['humMin','humMin'],['humMax','humMax'],['tMin','tMin'],['tMax','tMax'],['nh3Tol','nh3TolW'],['breedDays','breedDays'],['litter','litter']],
  soilm:[['rate','rate'],['o2Per','o2Per']],
  decor:[['x','x'],['z','z'],['rot','rot'],['rotX','rotX'],['rotZ','rotZ'],['size','size']],
  sub:[['depth','depth']]
};

const STR={noO2:['缺氧','Low oxygen'],nh3:['氨中毒','Ammonia poisoning'],cold:['太凍','Too cold'],hot:['太熱','Too hot'],hungry:['飢餓','Hungry'],dry:['太乾','Too dry'],wet:['太濕','Too humid'],
  co2:['二氧化碳過高','CO₂ too high'],mould:['霉菌','Mould'],noWater:['冇水','No water'],needFresh:['要淡水','Needs fresh water'],needSalt:['要海水','Needs salt water'],flow:['水流太強','Current too strong'],
  noSand:['冇底沙生根','No substrate to root'],noRock:['冇石或沉木依附','Nothing to attach to'],noSoil:['冇泥土','No soil'],noMud:['冇泥生根','No mud to root in'],lowN:['缺養分','Low nutrients'],lowLight:['光照不足','Not enough light'],
  hiN:['氨太高','Ammonia too high'],attacked:['俾其他生物攻擊','Attacked'],weak:['衰弱','Weakness'],eaten:['俾其他生物食咗','Eaten'],soilDry:['泥土太乾','Soil too dry']};
const SS=code=>code?N(STR[code]||[code,code]):'';

/* ================= 物種同造景 =================
   m: 可用模式 aqua / rain / both；hab: water / land / amph / none；w: fresh / salt */
const CAT={
  hornwort:{m:'both',hab:'water',kind:'plant',g:'aplant',name:['金魚藻','Hornwort'],sci:'Ceratophyllum',color:'#4f8f2c',root:'none',desc:['生長快、產氧多，唔使生根，浮喺水中都得。','Fast-growing oxygen producer; no roots needed, can float.'],params:{o2Prod:.8,resp:.1,uptake:.012}},
  elodea:{m:'both',hab:'water',kind:'plant',g:'aplant',name:['水蘊草','Brazilian waterweed'],sci:'Egeria densa',color:'#5c9a33',root:'sand',desc:['葉密生長快，產氧大戶，要種喺沙入面。','Dense, fast and a big oxygen producer; plant it in sand.'],params:{o2Prod:.7,resp:.09,uptake:.011}},
  vallis:{m:'both',hab:'water',kind:'plant',g:'aplant',name:['苦草','Vallisneria'],sci:'Vallisneria',color:'#6aa33a',root:'sand',desc:['長條葉子，產氧穩定，要有底沙生根。','Long ribbon leaves and steady oxygen; needs substrate to root.'],params:{o2Prod:.6,resp:.08,uptake:.01}},
  javafern:{m:'both',hab:'water',kind:'plant',g:'aplant',name:['黑木蕨','Java fern'],sci:'Microsorum',color:'#2f6b33',root:'rock',desc:['綁喺石頭或沉木上，唔使強光，好難養死。','Tied to rock or wood, low light, very hardy.'],params:{o2Prod:.35,resp:.05,uptake:.005}},
  moss:{m:'both',hab:'water',kind:'plant',g:'aplant',name:['莫絲','Java moss'],sci:'Taxiphyllum',color:'#3d6b25',root:'rock',desc:['依附石頭生長，俾蝦同螺藏身。','Grows on rock; cover for shrimp and snails.'],params:{o2Prod:.3,resp:.04,uptake:.004}},
  marimo:{m:'both',hab:'water',kind:'plant',g:'aplant',name:['綠藻球','Marimo ball'],sci:'Aegagropila',color:'#3e7d2c',root:'none',desc:['慢慢生長嘅毛球，產氧唔多，但蝦好鍾意喺上面揾食。','Slow fuzzy ball; little oxygen, but shrimp love grazing on it.'],params:{o2Prod:.12,resp:.02,uptake:.003}},

    aO2:21*13.3*a,aCO2:600*a*.0018,hum:st.mode==='rain'?75:60,waste:st.mode==='rain'?1:0,soilN:2,mould:0,feed:0};

function freshWater(c,dWL,first){c.O2+=sat(c.T||24)*dWL;c.CO2+=.6*dWL;c.NO3+=.5*dWL;if(first)c.algae=1;}
const TMAT={1:'sand',2:'gravel',3:'soil'},TMAT_ID={sand:1,gravel:2,soil:3};

  const subTypes={};let rocks=0;Object.entries(area).forEach(([m,a])=>{const tm=TMATS[m]||TMATS[1];if(a/n>.01)subTypes[tm.cls]=1;if(tm.rock&&a/n>.05)rocks++;});
  return t._info={sub:hs/n,subTypes,rocks};}

const label=it=>it.name||`${N(CAT[it.type].name)} #${it.n}`;
function randName(){const used=new Set(S.items.map(i=>i.name));const free=PET_NAMES.filter(n=>!used.has(N(n)));const Lst=free.length?free:PET_NAMES;return N(Lst[Math.floor(Math.random()*Lst.length)]);}

function nextN(type,list){return Math.max(0,...(list||S.items).filter(i=>i.type===type).map(i=>i.n))+1;}
function logEv(zh,en,c){S.log.unshift({t:[zh,en],c,d:S.day,h:S.hour});if(S.log.length>60)S.log.pop();}

function die(it,why,st,by){

  const en=`${it.name||CAT[it.type].name[1]+' #'+it.n}${it.name?' ('+CAT[it.type].name[1]+')':''} ${k==='microbe'?'stopped working':'died'} (${why==='eaten'&&by?'eaten by '+by:why==='attacked'&&by?'killed by '+by:STR[why]?STR[why][1]:why})`;

/* ================= 模擬（每小時） ================= */
let wasteFx=[],mistFx=0;
function step(st){

    let nW=0,nL=0;for(const it of aliveIn(st,'animal')){const d=CAT[it.type].diet;if(isWater(it)&&d.flake)nW+=it.params.food;if(!isWater(it)&&d.feed)nL+=it.params.food;}

    if(fl>0)c.feed+=fl;

    if(st.wxMode==='auto'){st.wxLeft--;if(st.wxLeft<=0){
      let nx=st.wx;if(Math.random()>.4||!RG.w[st.wx]){const tot=Object.values(RG.w).reduce((a,b)=>a+b,0);let r=Math.random()*tot;for(const [k,p] of Object.entries(RG.w)){r-=p;if(r<=0){nx=k;break;}}}

function hurt(it,dh,st){it.health=clamp(it.health+dh,0,1);if(it.health<=0)die(it,it.stress||'weak',st);}

    if(C.burrow&&!E.subTypes.sand){dh=Math.min(dh,0)-.01;it.stress=it.stress||'noSand';}

function stepLand(st,c,wL,light,lm,q,E,w){

function eat(it,c){
  const p=it.params,per=p.food/24*(it.age!=null&&it.age<4?.5:1);if(per<=0)return;

function predation(st){

    for(const [t,dmg] of Object.entries(C.attacks)){if(Math.random()>.15)continue;

  const sh=SHAPES[S.shape],M=MATS[S.mat],k=Math.cbrt(S.V/4);
  J.k=k;J.box=!!sh.box;J.R=sh.R*k;J.H=sh.H*k;J.pts=shapeSamples(sh);
  let y=.008*k;J.subs={};J.floor=y;
  if(!S.terra)for(const it of S.items)if(it.alive&&CAT[it.type].kind==='sub'){const d=it.params.depth*.025*k;J.subs[it.uid]=[y,y+d];y+=d;}
  J.sTop=Math.min(y,J.H*.35);
  J.terrain=!S.terra&&S.mode==='rain'&&S.items.some(i=>i.alive&&i.type==='soil');
  J.hillH=(S.hillH||0)*.025*k;
  J.airTop=J.H*.9;
  if(S.mode==='aqua')J.waterTop=S.filled?J.H*sh.w:null;
  else J.waterTop=S.level>0?Math.min(J.sTop+S.level*.025*k,J.H*.7):null;
  const {R,H}=J;
  const maxR=J.box?R:Math.max(...J.pts.map(p=>p.x))*R;
  J.open=J.box?1:Math.pow(rAt(H)/maxR,2);
  const topY=J.waterTop||J.H*.8;
  J.minR=J.box?R:Math.min(...[0,.2,.4,.6,.8,1].map(f=>rAt(J.sTop+f*(Math.min(topY,H*.85)-J.sTop))));
  // 水量
  const oldWL=S._lastWL??wLOf(S);
  if(S.mode==='aqua'){S.wL=S.filled?S.V:0;S.wFrac=1;}
  else if(J.waterTop==null){S.wL=0;S.wFrac=0;}
  else{let n=0,sd=0;for(let i=0;i<240;i++){const [x,z]=randIn(J.sTop,.98),d=J.waterTop-groundY(x,z);if(d>0){n++;sd+=d;}}S.wFrac=n/240;
    S.wL=+(S.V*clamp(sd/240/(J.H*.82),0,1)).toFixed(2);}
  if(!opt.keepChem)resetWaterIfNew(oldWL);
  S._lastWL=wLOf(S);
  // 玻璃
  glassMat=new THREE.MeshPhongMaterial({color:M.c,transparent:true,opacity:M.op,shininess:M.sh,specular:M.sh>20?0xffffff:0x222222,side:THREE.DoubleSide,depthWrite:false});
  glassMat.userData.base=M.op;
  const hlMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:M.sh>20?.09:.02,side:THREE.DoubleSide,depthWrite:false});
  const hidden=new THREE.MeshBasicMaterial({visible:false});
  if(J.box){
    const g=new THREE.BoxGeometry(2*R,H,2*R).translate(0,H/2,0);
    jarG.add(new THREE.Mesh(g,[glassMat,glassMat,hidden,glassMat,glassMat,glassMat]));
    jarG.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0x2c3a3c,transparent:true,opacity:.55})));
    const hl=new THREE.Mesh(new THREE.PlaneGeometry(R*.12,H*.85),hlMat);hl.position.set(R*.55,H*.5,R+.004);jarG.add(hl);
  } else {
    jarG.add(new THREE.Mesh(latheBand(0,H,1),glassMat));
    jarG.add(new THREE.Mesh(latheBand(H*.04,H*.96,1.004,.4,.24),hlMat));
    const bot=new THREE.Mesh(new THREE.CircleGeometry(rAt(0),72),glassMat);bot.rotation.x=-Math.PI/2;bot.position.y=.002;jarG.add(bot);
    const rim=new THREE.Mesh(new THREE.TorusGeometry(rAt(H),.025*k,8,72),glassMat.clone());rim.material.opacity=Math.min(.6,M.op*2.5);rim.rotation.x=Math.PI/2;rim.position.y=H;jarG.add(rim);
  }
  buildTerrain();
  // 水
  waterMat=surfMat=null;
  if(J.waterTop!=null){
    waterMat=new THREE.MeshPhongMaterial({color:0x9fd6e0,transparent:true,opacity:.18,shininess:60,depthWrite:false,side:THREE.DoubleSide});
    surfMat=new THREE.MeshPhongMaterial({color:0xbfe6ee,transparent:true,opacity:.32,shininess:140,specular:0xffffff,side:THREE.DoubleSide,depthWrite:false});
    const wt=J.waterTop;
    if(J.box){
      jarG.add(new THREE.Mesh(new THREE.BoxGeometry(2*R*.985,wt-J.sTop,2*R*.985).translate(0,(wt+J.sTop)/2,0),[waterMat,waterMat,hidden,hidden,waterMat,waterMat]));
      const s=new THREE.Mesh(new THREE.PlaneGeometry(2*R*.985,2*R*.985),surfMat);s.rotation.x=-Math.PI/2;s.position.y=wt;jarG.add(s);
    } else {
      jarG.add(new THREE.Mesh(latheBand(J.sTop,wt,.985),waterMat));
      const s=new THREE.Mesh(new THREE.CircleGeometry(rAt(wt)*.985,72),surfMat);s.rotation.x=-Math.PI/2;s.position.y=wt;jarG.add(s);
    }
  }
  lid=new THREE.Group();
  if(J.box){const l=new THREE.Mesh(new THREE.BoxGeometry(2*R+.04,.03,2*R+.04),glassMat.clone());l.material.opacity=Math.min(.6,M.op*2);l.position.y=H+.02;lid.add(l);}
  else{const rt=rAt(H);const cork=new THREE.Mesh(new THREE.CylinderGeometry(rt*.97,rt*.9,Math.max(.12,rt*.25),40),mat(0xa77a4c));cork.position.y=H+.03;lid.add(cork);}
  jarG.add(lid);
  lampMat=new THREE.MeshBasicMaterial({color:0xfff3c4});
  const ly=H+.9*k;
  const lamp=new THREE.Mesh(new THREE.CylinderGeometry(maxR*.5,maxR*.5,.04,32),lampMat);lamp.position.y=ly;jarG.add(lamp);
  const cord=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,3,4),mat(0x333333));cord.position.y=ly+1.5;jarG.add(cord);
  // 氧氣泵（氣石）同過濾器：擺喺水最深嘅地方
  const deep=J.waterTop!=null?(waterPoint(.15)||[0,0]):[0,0];
  pumpG=new THREE.Group();
  const [px,pz]=J.box&&S.mode==='aqua'?[-R*.7,R*.55]:[deep[0]*.9,deep[1]*.9];
  const pg=groundY(px,pz);
  const stoneM=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.05,12),mat(0xd9d4cc));stoneM.position.set(px,pg+.025,pz);pumpG.add(stoneM);
  pumpG.userData.src=new THREE.Vector3(px,pg+.05,pz);jarG.add(pumpG);
  filterG=new THREE.Group();
  const [fx2,fz]=J.box&&S.mode==='aqua'?[R*.7,-R*.65]:[deep[0]*.5+.12,deep[1]*.5-.08];
  const fg=groundY(fx2,fz);
  const sponge=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.18,14),mat(0x1d1f22));sponge.position.set(fx2,fg+.09,fz);filterG.add(sponge);
  filterG.userData.src=new THREE.Vector3(fx2,fg+.2,fz);jarG.add(filterG);
  // 重建生物
  S.items.forEach(it=>{if(it.g)disposeObj(it.g);it.g=null;if(!it.alive){it.gone=true;return;}buildItem(it);});
  S.items=S.items.filter(i=>!i.gone);
  if(S.sel&&!S.items.includes(S.sel))S.sel=null;
  dirtyList=true;
  if(!opt.keepCam){cam.target.set(0,H*.45,0);cam.dist=Math.max(H,maxR*2)*2.5;}
  buildMicrobeLayer();layoutWeather(maxR);
}
function buildTerrain(){
  if(S.terra){buildTerraMesh();return;}
  if(J.terrMesh){disposeObj(J.terrMesh);J.terrMesh=null;}
  if(!J.terrain)return;
  const R=floorR()*.985,geo=new THREE.PlaneGeometry(2*R,2*R,52,52);geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position,col=new Float32Array(pos.count*3),c1=new THREE.Color(0x5b4030),c2=new THREE.Color(0x4f6b2e),c3=new THREE.Color(0x3e2b1f),tmp=new THREE.Color();
  for(let i=0;i<pos.count;i++){let x=pos.getX(i),z=pos.getZ(i);if(!J.box){const r=Math.hypot(x,z);if(r>R){x*=R/r;z*=R/r;}}
    const h=hillAt(x,z),under=J.waterTop!=null&&J.sTop+h<J.waterTop;
    pos.setXYZ(i,x,J.sTop+h+.002,z);
    tmp.copy(under?c3:c1).lerp(under?c1:c2,clamp((under?.3:.35)+.35*Math.sin(x*13+z*11),0,1));col.set([tmp.r,tmp.g,tmp.b],i*3);}
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();
  J.terrMesh=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({vertexColors:true}));jarG.add(J.terrMesh);
}

function plantStem(color,leafGeo,leafN,spacing,tilt,maxH){
  const g=new THREE.Group(),h=clamp(rnd(.65,1)*maxH*.8,.2,3);
  const bb=Math.min(.2,J.minR*.15),bx=rnd(-bb,bb),bz=rnd(-bb,bb),pts=[];
  for(let i=0;i<=4;i++){const t=i/4;pts.push(new THREE.Vector3(bx*t*t,t*h,bz*t*t));}
  const curve=new THREE.CatmullRomCurve3(pts),m=mat(color,{side:THREE.DoubleSide});
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,16,.01,5,false),m));
  const wh=Math.max(1,Math.floor(h/spacing)),im=new THREE.InstancedMesh(leafGeo,m,wh*leafN),d=new THREE.Object3D();let k=0;
  for(let w=0;w<wh;w++){const t=(w+1)/(wh+1),p=curve.getPoint(t),s=1.15-.6*t;
    for(let j=0;j<leafN;j++){d.position.copy(p);d.rotation.set(0,j/leafN*6.283+w*.7,0);d.rotateZ(-tilt);d.scale.setScalar(s);d.updateMatrix();im.setMatrixAt(k++,d.matrix);}}
  g.add(im);g.userData.top=h;return g;
}
function blades(color,n,hMul,w,bendMax){
  const g=new THREE.Group(),m=mat(color,{side:THREE.DoubleSide});g.userData.blades=[];let top=0;
  for(let i=0;i<n;i++){const h=clamp(rnd(.6,.95)*hMul,.08,3);top=Math.max(top,h);
    const geo=new THREE.PlaneGeometry(w,h,1,10);geo.translate(0,h/2,0);const pos=geo.attributes.position,bend=rnd(bendMax*.3,bendMax)*(Math.random()<.5?-1:1);
    for(let v=0;v<pos.count;v++){const y=pos.getY(v)/h;pos.setX(v,pos.getX(v)*(1-y*.5)+bend*y*y);}geo.computeVertexNormals();
    const b=new THREE.Mesh(geo,m);b.rotation.y=rnd(0,6.28);b.position.set(rnd(-.04,.04),0,rnd(-.04,.04));b.userData.ph=rnd(0,6);g.add(b);g.userData.blades.push(b);}
  g.userData.top=top;return g;
}
function fronds(color,n,len,w,arch){
  const g=new THREE.Group(),m=mat(color,{side:THREE.DoubleSide});g.userData.blades=[];
  for(let i=0;i<n;i++){const Ln=len*rnd(.75,1.1),geo=new THREE.PlaneGeometry(w,Ln,1,10);geo.translate(0,Ln/2,0);const pos=geo.attributes.position;
    for(let v=0;v<pos.count;v++){const t=pos.getY(v)/Ln;pos.setX(v,pos.getX(v)*(1-t*.85));pos.setZ(v,arch*t*t*Ln);pos.setY(v,pos.getY(v)*(1-.35*t*t));}
    geo.computeVertexNormals();const b=new THREE.Mesh(geo,m);b.rotation.y=i/n*6.28+rnd(-.2,.2);b.rotateX(rnd(.15,.45));b.userData.ph=rnd(0,6);g.add(b);g.userData.blades.push(b);}
  g.userData.top=len;return g;

const TMATS={
  1:{n:['細沙','Fine sand'],c:0xcab68c,cls:'sand'},4:{n:['白沙','White sand'],c:0xe9e3d3,cls:'sand'},5:{n:['珊瑚沙','Coral sand'],c:0xf0d4bc,cls:'sand'},6:{n:['黑金沙','Black sand'],c:0x2f2d2a,cls:'sand'},
  2:{n:['碎石','Gravel'],c:0x8f8a80,cls:'gravel',rough:1},7:{n:['卵石','Pebbles'],c:0xa7a196,cls:'gravel',rough:2},8:{n:['火山石','Lava rock'],c:0x6a3a2a,cls:'gravel',rough:2,rock:1},
  3:{n:['泥土','Soil'],c:0x5b4030,cls:'soil'},9:{n:['水草泥','Aqua soil'],c:0x3a2c22,cls:'soil',rough:1},10:{n:['赤玉土','Akadama'],c:0xa5603a,cls:'soil',rough:1},11:{n:['苔蘚地','Moss bed'],c:0x4f7d2e,cls:'soil',moss:1}};
const TCOL=new Proxy({},{get:(o,m)=>m==0?0xb9c6ca:(TMATS[m]||TMATS[1]).c});
const TN=24;
function terraIdx(x,z){const Rf=floorR()*.985,n=S.terra.n;return[clamp((x/Rf+1)/2*(n-1),0,n-1),clamp((z/Rf+1)/2*(n-1),0,n-1)];}
function terraH(x,z){const t=S.terra;if(!t)return 0;const n=t.n,[u,v]=terraIdx(x,z),i0=Math.floor(u),j0=Math.floor(v),i1=Math.min(n-1,i0+1),j1=Math.min(n-1,j0+1),fu=u-i0,fv=v-j0;
  const h=(i,j)=>t.h[j*n+i];return((h(i0,j0)*(1-fu)+h(i1,j0)*fu)*(1-fv)+(h(i0,j1)*(1-fu)+h(i1,j1)*fu)*fv)*.025*J.k;}
function terraM(x,z){const t=S.terra;if(!t)return 0;const [u,v]=terraIdx(x,z);return t.m[Math.round(v)*t.n+Math.round(u)];}
function initTerra(){
  const n=TN,h=new Array(n*n).fill(0),m=new Array(n*n).fill(0),Rf=floorR()*.985;
  const top=S.items.filter(i=>i.alive&&CAT[i.type].kind==='sub').pop();
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){const x=(i/(n-1)*2-1)*Rf,z=(j/(n-1)*2-1)*Rf,g=groundY(x,z)-.008*J.k;
    h[j*n+i]=+Math.max(0,g/(.025*J.k)).toFixed(1);m[j*n+i]=h[j*n+i]>.2?(J.terrain?3:TMAT_ID[top?top.type:'sand']||1):0;}

}
function terraEnsure(t){
  if(!S.terra)initTerra();const T=S.terra,id=TMAT_ID[t]||1;
  for(let i=0;i<T.h.length;i++)if(!T.m[i]){T.m[i]=id;T.h[i]=Math.max(T.h[i],1.5);}
  delete T._info;buildJar({keepCam:true});
}
const BRUSH_TOOLS=[['raise',['堆高','Raise']],['lower',['挖低','Dig']],['smooth',['抹平','Smooth']],['water',['水區','Water']],['erase',['清走','Clear']],['view',['淨係睇','View only']]];
let buildTool='paint',paintMat=1,brushSize=.18,terraDirty=false;
function applyBrush(x,z){
  const T=S.terra;if(!T)return;const n=T.n,Rf=floorR()*.985,cu=(x/Rf+1)/2*(n-1),cv=(z/Rf+1)/2*(n-1),br=brushSize*(n-1)/2;
  const lvl=S.mode==='rain'?S.level:0,defM=S.mode==='rain'?3:1;
  for(let j=Math.max(0,Math.floor(cv-br));j<=Math.min(n-1,Math.ceil(cv+br));j++)for(let i=Math.max(0,Math.floor(cu-br));i<=Math.min(n-1,Math.ceil(cu+br));i++){
    const d=Math.hypot(i-cu,j-cv)/br;if(d>1)continue;const w=1-d*d,k=j*n+i;
    if(buildTool==='paint'){T.m[k]=paintMat;T.h[k]=Math.min(15,T.h[k]+.6*w);}
    else if(buildTool==='raise'){T.h[k]=Math.min(15,T.h[k]+.5*w);if(!T.m[k])T.m[k]=defM;}
    else if(buildTool==='lower'){T.h[k]=Math.max(0,T.h[k]-.5*w);if(T.h[k]<.1)T.m[k]=0;}
    else if(buildTool==='smooth'){let s=0,c=0;for(let b=-1;b<=1;b++)for(let a=-1;a<=1;a++){const ii=i+a,jj=j+b;if(ii>=0&&jj>=0&&ii<n&&jj<n){s+=T.h[jj*n+ii];c++;}}T.h[k]+=(s/c-T.h[k])*.35*w;}
    else if(buildTool==='water'){const tgt=Math.max(0,(S.mode==='rain'?Math.max(lvl,5):6)-3);T.h[k]=Math.max(0,T.h[k]-(T.h[k]-Math.min(T.h[k],tgt))*.5*w-.2*w);if(!T.m[k]||T.m[k]===3)T.m[k]=1;}
    else if(buildTool==='erase'){T.h[k]*=1-.6*w;T.m[k]=T.h[k]<.3?0:T.m[k];if(T.h[k]<.3)T.h[k]=0;}
    T.h[k]=+T.h[k].toFixed(2);
  }
  if(buildTool==='water'&&S.mode==='rain'&&!(S.level>0))S.level=5;
  delete T._info;terraDirty=true;
}
function buildTerraMesh(){
  if(J.terrMesh){disposeObj(J.terrMesh);J.terrMesh=null;}
  if(!S.terra)return;
  const Rf=floorR()*.985,pos=[],col=[],idx=[],ring=[],fl=J.floor,c=new THREE.Color(),moss=new THREE.Color(0x4f6b2e),wet=new THREE.Color(0x3e2b1f);
  const vtx=(x,z,y)=>{pos.push(x,y,z);return pos.length/3-1;};
  const colorAt=(x,z,y,top)=>{const m=top?terraM(x,z):3;c.setHex(TCOL[m]);if(!top)c.multiplyScalar(.75);
    if(top&&TMATS[m]&&TMATS[m].cls==='soil'&&!TMATS[m].moss&&S.mode==='rain'){const under=J.waterTop!=null&&y<J.waterTop;c.lerp(under?wet:moss,under?.4:clamp(.35+.3*Math.sin(x*13+z*11),0,.7));}
    const tm=TMATS[m];if(top&&tm&&tm.cls!=='soil')c.multiplyScalar(.92+.08*Math.sin(x*29+z*17));if(top&&tm&&tm.rough)c.multiplyScalar(1-.18*tm.rough*Math.abs(Math.sin(x*61)*Math.cos(z*53)));if(top&&tm&&tm.moss)c.lerp(moss,.3+.2*Math.sin(x*17+z*9));col.push(c.r,c.g,c.b);};
  if(J.box){const G=40,grid=[];
    for(let j=0;j<=G;j++)for(let i=0;i<=G;i++){const x=(i/G*2-1)*Rf,z=(j/G*2-1)*Rf,y=fl+terraH(x,z)+.002;grid.push(vtx(x,z,y));colorAt(x,z,y,true);}
    for(let j=0;j<G;j++)for(let i=0;i<G;i++){const a=j*(G+1)+i,b=a+1,d=a+G+1,e=d+1;idx.push(a,d,b,b,d,e);}
    for(let i=0;i<G;i++)ring.push(grid[i]);for(let j=0;j<G;j++)ring.push(grid[j*(G+1)+G]);for(let i=G;i>0;i--)ring.push(grid[G*(G+1)+i]);for(let j=G;j>0;j--)ring.push(grid[j*(G+1)]);
  } else {const RN=24,SG=72;const ctr=vtx(0,0,fl+terraH(0,0)+.002);colorAt(0,0,fl+terraH(0,0),true);const rows=[];
    for(let r=1;r<=RN;r++){const row=[];for(let s=0;s<SG;s++){const a=s/SG*Math.PI*2,x=Math.cos(a)*Rf*r/RN,z=Math.sin(a)*Rf*r/RN,y=fl+terraH(x,z)+.002;row.push(vtx(x,z,y));colorAt(x,z,y,true);}rows.push(row);}
    for(let s=0;s<SG;s++){idx.push(ctr,rows[0][(s+1)%SG],rows[0][s]);}
    for(let r=0;r<RN-1;r++)for(let s=0;s<SG;s++){const a=rows[r][s],b=rows[r][(s+1)%SG],d=rows[r+1][s],e=rows[r+1][(s+1)%SG];idx.push(a,b,d,b,e,d);}

  // 側邊：由邊界落返瓶底
  const bot=ring.map(k=>{const x=pos[k*3],z=pos[k*3+2];const v=vtx(x,z,fl);colorAt(x,z,fl,false);return v;});
  const top0=ring.map(k=>{const x=pos[k*3],y=pos[k*3+1],z=pos[k*3+2];const v=vtx(x,z,y);colorAt(x,z,y,false);return v;});
  for(let i=0;i<ring.length;i++){const a=top0[i],b=top0[(i+1)%ring.length],d=bot[i],e=bot[(i+1)%ring.length];idx.push(a,d,b,b,d,e);}

}

function addFromCatalog(t){

  if(LIMIT[t]!=null&&n>=LIMIT[t]){toast(L(`${c.name[0]}最多 ${LIMIT[t]} 個`,`Up to ${LIMIT[t]} ${c.name[1].toLowerCase()}`));return;}

function paramChips(type){const c=CAT[type],p=c.params,g=c.g;
  if(g==='aplant')return[L(`產氧 ${p.o2Prod} mg/h`,`O₂ ${p.o2Prod} mg/h`),L(`吸收 ${p.uptake} mg/h`,`uptake ${p.uptake} mg/h`)];
  if(g==='rplant')return[L(`產氧 ${p.o2Prod} mg/h`,`O₂ ${p.o2Prod} mg/h`),L(`加濕 ${p.transp}%/h`,`humidity +${p.transp}%/h`),L(`濕度 ≥${p.humMin}%`,`humidity ≥${p.humMin}%`)];
  if(g==='aanimal')return[L(`食 ${p.food} 份/日`,`eats ${p.food}/day`),L(`每 ${p.wasteEvery} 小時去廁所`,`poops every ${p.wasteEvery} h`),`${p.tMin}–${p.tMax}°C`,...(p.breedDays?[L(`約 ${p.breedDays} 日生一次`,`breeds ~${p.breedDays} days`)]:[]),...(c.w==='salt'?[L('海水','salt water')]:[])];
  if(g==='ranimal'||g==='amph')return[L(`食 ${p.food} 份/日`,`eats ${p.food}/day`),L(`濕度 ${p.humMin}–${p.humMax}%`,`humidity ${p.humMin}–${p.humMax}%`),`${p.tMin}–${p.tMax}°C`,...(c.hab==='amph'?[L('要有水區','needs water')]:[])];
  if(g==='nitri')return[L(`分解氨 ${p.cap} mg/h`,`ammonia ${p.cap} mg/h`)];
  if(g==='decomp'||g==='soilm')return[L(`分解 ${p.rate} 份/h`,`breaks down ${p.rate}/h`)];
  if(g==='sub')return[L(`厚 ${p.depth} cm`,`${p.depth} cm thick`)];
  if(g==='decor')return[c.rock?L('細菌附著 +20%','+20% bacteria surface'):L('純裝飾','decorative')];
  return[];}
let catTag='all',catQ='',tagScroll=0;
const tagList=avail=>['all',...Object.keys(TAGS).filter(t=>t!=='all'&&avail.has(t))];
function dragScroll(el){let sx=0,sl=0,down=false,moved=false;
  el.onpointerdown=e=>{down=true;moved=false;sx=e.clientX;sl=el.scrollLeft;};
  el.onpointermove=e=>{if(!down)return;const d=e.clientX-sx;if(Math.abs(d)>4){moved=true;if(e.pointerType==='mouse')el.scrollLeft=sl-d;}};
  el.onpointerup=el.onpointerleave=el.onpointercancel=()=>{down=false;};
  el.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);}
function swipeFlip(el,flip){if(el._sw)return;el._sw=1;let sx=0,sy=0,t0=0;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;t0=Date.now();},{passive:true});
  el.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-t0<600)flip(dx<0?1:-1);},{passive:true});}

  const ids=Object.keys(CAT).filter(id=>okMode(CAT[id]));

/* ================= 瓶內 ================= */
function statusOf(it){
  const k=CAT[it.type].kind;
  if(!it.alive)return[L('已死亡','Dead'),'bad'];
  if(k==='sub')return[L(`${it.params.depth} cm 厚`,`${it.params.depth} cm thick`),''];
  if(k==='decor')return[L('造景','Hardscape'),''];
  if(it.stress)return[SS(it.stress),it.health<.4?'bad':'warn'];
  if(k==='animal'&&it.age!=null&&it.age<4)return[L('BB 成長中','Growing up'),''];
  if(k==='plant')return[it.lastProd>0?L(`產氧中 ${fx(it.lastProd,2)} mg/h`,`making ${fx(it.lastProd,2)} mg/h O₂`):L('夜間休息','Resting'),''];
  if(k==='animal')return[it.satiety<.4?L('有啲肚餓','A bit hungry'):L('精神','Healthy'),''];
  return[L('運作中','Working'),''];
}

/* ================= 讀數 ================= */
function rangeOf(key,list){const ans=(list||aliveIn(S,'animal')).filter(a=>a.params[key+'Min']!=null);if(!ans.length)return null;
  return[Math.max(...ans.map(a=>a.params[key+'Min'])),Math.min(...ans.map(a=>a.params[key+'Max']))];}
function meterList(){
  const aq=S.mode==='aqua',c=S.c,wL=wLOf(S),a=airL(S),out=[];
  const tr=rangeOf('t'),hr=rangeOf('hum');

    out.push([L('空氣 O₂','Air O₂'),c.aO2/(a*13.3),'%',1,21,v=>v<17?'bad':v<19?'warn':'','ao2']);

    out.push([L('濕度','Humidity'),c.hum,'%',0,100,v=>rs(v,hr,5),'hum']);

    out.push([L('霉菌','Mould'),c.mould,'',1,60,v=>v>20?'bad':v>10?'warn':'','mould']);
  }

    if(aq)out.push([L('水溫','Water temp'),c.T,'°C',1,40,v=>rs(v,tr,2),'T']);
    out.push([aq?L('氨 NH₃','Ammonia'):L('水中氨','Water NH₃'),c.NH3/wL,'mg/L',2,1,v=>v>.5?'bad':v>.2?'warn':'','wnh3']);
    if(aq){out.push([L('硝酸鹽','Nitrate'),c.NO3/wL,'mg/L',1,50,v=>v>40?'bad':v>20?'warn':'','no3']);
      out.push(['CO₂',c.CO2/wL,'mg/L',2,6,v=>v<.3?'warn':'','wco2']);}
    out.push([L('藻類','Algae'),c.algae,'',0,60,v=>v>45?'bad':v>30?'warn':'','algae']);
    if(aq)out.push([L('飼料/殘渣','Food/detritus'),c.flake+c.detritus,'',1,20,v=>v>15?'warn':'','food']);

}
function renderMeters(){

/* ================= 平衡分析 ================= */

function rangeRow(l,lo,hi,cur,min,max,u){const X=v=>clamp((v-min)/(max-min),0,1)*100;

function budgets(){

function drawChart(){
  const cv=$('#chart');if(!cv)return;const w=cv.clientWidth,h=cv.clientHeight||170,dpr=Math.min(devicePixelRatio,2);cv.width=w*dpr;cv.height=h*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);const cs=getComputedStyle(document.documentElement);const col=k=>cs.getPropertyValue(k).trim();
  const H=S.hist.slice(-168),pl=30,pr=34,pt=8,pb=18,iw=w-pl-pr,ih=h-pt-pb;
  x.font='10px '+col('--f-mono');x.fillStyle=col('--muted');
  if(H.length<2){x.fillText(L('模擬緊，等一陣…','Simulating…'),pl,h/2);return;}
  const aq=S.mode==='aqua';
  const k1=aq?'wo2':'hum',max1=aq?14:100,ticks1=aq?[0,4,8,12]:[0,25,50,75,100];
  const k2=aq?'wnh3':'T',max2=aq?Math.max(1,Math.ceil(Math.max(...H.map(p=>p.wnh3||0))*2)/2):40;
  const X=i=>pl+i/(H.length-1)*iw,Y1=v=>pt+ih-clamp(v/max1,0,1)*ih,Y2=v=>pt+ih-clamp(v/max2,0,1)*ih;
  x.fillStyle=col('--line');x.globalAlpha=.5;H.forEach((p,i)=>{if(!p.light)x.fillRect(X(i)-iw/(H.length-1)/2,pt,iw/(H.length-1)+.5,ih);});x.globalAlpha=1;
  x.strokeStyle=col('--line');x.lineWidth=1;x.fillStyle=col('--muted');x.textAlign='right';
  ticks1.forEach(v=>{x.beginPath();x.moveTo(pl,Y1(v));x.lineTo(pl+iw,Y1(v));x.stroke();x.fillText(v,pl-5,Y1(v)+3);});
  x.textAlign='left';[0,max2/2,max2].forEach(v=>x.fillText(fx(v,aq?2:0),pl+iw+5,Y2(v)+3));
  if(aq){x.strokeStyle=col('--bad');x.setLineDash([3,3]);x.beginPath();x.moveTo(pl,Y1(3));x.lineTo(pl+iw,Y1(3));x.stroke();x.setLineDash([]);}
  const line=(k,Y,c)=>{x.strokeStyle=c;x.lineWidth=2;x.beginPath();H.forEach((p,i)=>i?x.lineTo(X(i),Y(p[k]||0)):x.moveTo(X(i),Y(p[k]||0)));x.stroke();
    const l=H[H.length-1];x.fillStyle=c;x.beginPath();x.arc(X(H.length-1),Y(l[k]||0),3,0,7);x.fill();};
  line(k1,Y1,col('--o2'));line(k2,Y2,col('--warn'));
  x.fillStyle=col('--muted');x.textAlign='center';x.fillText(L(`${H.length} 小時前`,`${H.length} h ago`),pl+30,h-4);x.fillText(L('而家','now'),pl+iw-10,h-4);
}

const SNAP_KEYS=['customRegion','terra','region','real','mode','V','shape','mat','sealed','light','feed','pump','filter','heater','wc','mist','heat','water','filled','level','hillH','breed','wxMode','wx','hour','day'];
function snapshot(){if(S.terra)delete S.terra._info;const o={name:S.jarName,c:Object.assign({},S.c),log:S.log.slice(0,40),hist:S.hist.slice(-120),
  items:S.items.filter(i=>i.alive).map(i=>({type:i.type,params:i.params,name:i.name||'',n:i.n,health:+i.health.toFixed(3),satiety:+i.satiety.toFixed(3),rx:+i.rx.toFixed(3),rz:+i.rz.toFixed(3),age:i.age,up:i.userPlaced?1:0}))};
  SNAP_KEYS.forEach(k=>o[k]=S[k]);return o;}
function restoreSnap(d){
  S.items.forEach(i=>disposeObj(i.g));S.items=[];S.sel=null;S.report=null;
  SNAP_KEYS.forEach(k=>{if(d[k]!==undefined)S[k]=d[k];});S.jarName=d.name||'';
  if(S.terra){S.terra=JSON.parse(JSON.stringify(S.terra));delete S.terra._info;}S.build=false;
  if(!SHAPES[S.shape])S.shape='jar';if(!MATS[S.mat])S.mat='glass';if(!PRESETS[S.mode])S.mode='aqua';if(S.wxMode!=='auto'&&!WX[S.wxMode])S.wxMode='auto';if(!WX[S.wx])S.wx='sunny';
  (d.items||[]).forEach(o=>{if(!CAT[o.type])return;const it=makeItem(o.type,o.params);Object.assign(it,{n:o.n||nextN(o.type),name:o.name||'',health:o.health??1,satiety:o.satiety??1});
    if(o.rx!=null){it.rx=o.rx;it.rz=o.rz;}if(o.age!=null)it.age=o.age;if(o.up)it.userPlaced=true;S.items.push(it);});
  buildJar({keepChem:true});resetChem(S);if(d.c)Object.assign(S.c,d.c);S.log=d.log||[];S.hist=d.hist||[];
}
const blankSnap=i=>({terra:null,name:'',region:'hk',real:false,mode:'aqua',V:4,shape:'jar',mat:'glass',sealed:false,light:12,feed:0,pump:false,filter:false,heater:false,wc:0,mist:0,heat:false,water:'fresh',filled:false,level:0,hillH:6,breed:true,wxMode:'auto',wx:'sunny',hour:6,day:1,items:[]});
function switchJar(i){if(i===S.cur)return;S.jars[S.cur]=snapshot();S.cur=i;restoreSnap(S.jars[i]||blankSnap(i));renderAll();save();toast(L('轉咗去 ','Switched to ')+jarNames()[i]);}
const KEY='ecojar.v4';
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{const jars=S.jars.slice();jars[S.cur]=snapshot();S.jars=jars;localStorage.setItem(KEY,JSON.stringify({cur:S.cur,jars,ana:S.ana}));}catch(e){}},500);}
function load(){
  try{const l=localStorage.getItem('ecojar.lang');if(l==='en'||l==='zh')LANG=l;}catch(e){}
  try{const d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(d&&Array.isArray(d.jars)){S.jars=[0,1,2].map(i=>d.jars[i]||null);S.cur=clamp(d.cur|0,0,2);S.ana=d.ana||null;const j=S.jars[S.cur];if(j){restoreSnap(j);return true;}return false;}
    const o=JSON.parse(localStorage.getItem('ecojar.v2')||'null');
    if(o&&o.items&&PRESETS[o.mode]){const snap=Object.assign({},o,{name:'',level:o.mode==='rain'?0:0,items:o.items.filter(([t])=>CAT[t]).map(([type,params,name])=>({type,params,name}))});restoreSnap(snap);return true;}
  }catch(e){}
  return false;
}

function analyzeTank(A){
  const rain=A.type==='rain',salt=A.type==='salt',types=Object.keys(A.counts||{}).filter(t=>CAT[t]);
  if(!types.length)return`<div class="empty">${L('先填返缸入面有咩生物同數量。','Enter what lives in the tank first.')}</div>`;
  const animals=types.filter(t=>CAT[t].kind==='animal'),wL=rain?(+A.waterL||0):(+A.V||30);

  const hasW=!rain||wL>0;
  if(hasW){
    if(A.nh3!==''){const v=+A.nh3,s=v<=.02?'good':v<=.25?'warn':'bad';kv(L('氨 NH₃','Ammonia'),v,' mg/L',s,s==='good'?L('安全','Safe'):s==='warn'?L('偏高，要留意','Elevated, keep an eye on it'):L('危險，會中毒','Dangerous, toxic'));
      if(s!=='good')add(s,L('氨偏高','Ammonia is high'),L(`實測 ${v} mg/L。氨由排泄物同殘渣產生，硝化菌唔夠就會累積。`,`Measured ${v} mg/L. Ammonia comes from waste and leftovers and builds up without enough bacteria.`),[L('即刻換 30% 水（新水要去氯、同溫）','Change 30% of the water now (dechlorinated, same temperature)'),L('餵食減半，清走殘渣','Halve feeding and remove leftovers'),L('加硝化菌，或者檢查過濾有冇洗得太乾淨','Add bacteria, or check the filter was not over-cleaned')],SRC.known);}
    if(A.no2!==''){const v=+A.no2,s=v<=.1?'good':v<=.5?'warn':'bad';kv(L('亞硝酸鹽 NO₂','Nitrite'),v,' mg/L',s,s==='good'?L('安全','Safe'):s==='warn'?L('偏高','Elevated'):L('危險，影響魚呼吸','Dangerous, stops fish breathing'));
      if(s!=='good')add(s,L('亞硝酸鹽偏高','Nitrite is high'),L(`實測 ${v} mg/L，代表硝化菌未穩定，新缸好常見。`,`Measured ${v} mg/L: the bacteria are not established yet, common in new tanks.`),[L('換 25–30% 水','Change 25–30% of the water'),L('暫停加新生物','Stop adding animals for now'),L('每日測，直到跌返 0','Test daily until it reads 0')],SRC.known);}
    if(A.no3!==''){const v=+A.no3,lim=salt?[10,20]:[20,40],s=v<=lim[0]?'good':v<=lim[1]?'warn':'bad';kv(L('硝酸鹽 NO₃','Nitrate'),v,' mg/L',s,s==='good'?L('正常','Normal'):s==='warn'?L('偏高，藻類會多','Elevated, expect algae'):L('太高','Too high'));
      if(s!=='good')add(s,L('硝酸鹽偏高','Nitrate is high'),L(`實測 ${v} mg/L，換水唔夠或者生物太多。`,`Measured ${v} mg/L: not enough water changes or too many animals.`),[L('加大每週換水比例','Change more water each week'),L('加快生長水草或者浮萍','Add fast-growing plants or duckweed')],SRC.known);}
    if(A.ph!==''&&animals.some(t=>CAT[t].ph)){const v=+A.ph,ws=animals.filter(t=>CAT[t].ph),r=[Math.max(...ws.map(t=>CAT[t].ph[0])),Math.min(...ws.map(t=>CAT[t].ph[1]))];
      const s=v<r[0]||v>r[1]?(Math.abs(v-(v<r[0]?r[0]:r[1]))>.5?'bad':'warn'):'good';kv('pH',v,'',s,L(`適合 ${r[0]}–${r[1]}`,`suits ${r[0]}–${r[1]}`));
      if(s!=='good')add(s,L('pH 唔啱','pH is off'),L(`實測 ${v}，呢缸生物適合 ${r[0]}–${r[1]}。`,`Measured ${v}; these animals suit ${r[0]}–${r[1]}.`),[L('唔好一次過大幅調整，每日最多改 0.2','Change it slowly, no more than 0.2 a day'),L('檢查底沙同石頭會唔會改變 pH','Check whether substrate or rock is shifting pH')],SRC.known);}

  if(rain){const hr=rng('hum');if(hr&&hr[0]>hr[1])add('bad',L('濕度要求冇交集','No shared humidity'),L('例如守宮怕濕、箭毒蛙要好濕，放埋一齊總有一方唔舒服。','A gecko dislikes damp while a dart frog needs it; one of them will suffer.'),[L('分開兩個缸養','Keep them in separate tanks')],SRC.rule);

  else{const wrong=types.filter(t=>CAT[t].w&&CAT[t].w!=='both'&&CAT[t].w!==(salt?'salt':'fresh')||CAT[t].hab==='land'||CAT[t].hab==='amph');

  animals.forEach(t=>{const C=CAT[t];if(C.preys){const v=types.filter(x=>C.preys.includes(x));if(v.length)add('bad',L(`${C.name[0]}會食其他生物`,`${C.name[1]} will eat tankmates`),L(`${C.name[0]}會捉${v.map(x=>CAT[x].name[0]).join('、')}嚟食。`,`${C.name[1]} hunts ${v.map(x=>CAT[x].name[1].toLowerCase()).join(', ')}.`),[L('分開飼養','Keep them apart'),L('或者接受會有損失','Or accept some losses')],SRC.rule);}});

const modeKey=()=>S.mode==='aqua'?'aqua':(S.level>0?'palu':'rain');
let modeArm=null,modeArmT=0;
function armMode(t,msg){if(modeArm===t)return true;modeArm=t;clearTimeout(modeArmT);modeArmT=setTimeout(()=>modeArm=null,3500);toast(msg);return false;}
function setMode(t){
  const cur=modeKey();if(t===cur)return;
  const life=S.items.filter(i=>i.alive&&['plant','animal'].includes(CAT[i.type].kind));
  if(t==='aqua'){
    const land=life.filter(i=>!isWater(i));
    if(land.length&&!armMode(t,L(`再撳一次確認：${land.length} 個陸地生物會浸死`,`Tap again: ${land.length} land creature${land.length>1?'s':''} will drown`)))return;
    const salt=S.water==='salt';S.mode='aqua';if(!S.filled&&life.some(isWater))S.filled=true;if(S.level>0)S.filled=true;
    if(salt)S.water='salt';
  } else {
    const wasAqua=S.mode==='aqua',wl=life.filter(isWater);
    if(t==='rain'&&wl.length&&!armMode(t,L(`再撳一次確認：${wl.length} 個水中生物會冇水`,`Tap again: ${wl.length} water creature${wl.length>1?'s':''} will be left dry`)))return;
    if(wasAqua){const a=S.V*.75;S.c.aO2=21*13.3*a;S.c.aCO2=600*a*.0018;S.c.hum=75;S.c.waste=S.c.waste||0;}
    S.mode='rain';
    if(t==='palu'&&!(S.level>0))S.level=wasAqua&&S.filled?8:5;
    if(t==='rain')S.level=0;
  }
  modeArm=null;buildJar({keepCam:true});renderAll();save();
  toast(L('轉咗做','Switched to ')+N({aqua:['水族','aquatic'],rain:['雨林','rainforest'],palu:['水陸共生','paludarium']}[t])+L('，保留晒原有嘅嘢',', keeping everything'));
}

    let cx=ev.clientX-st.left,cy=ev.clientY-st.top,rx=40,ry=40;
    if(it.g){const b=new THREE.Box3().setFromObject(it.g),pts=[];if(!b.isEmpty()){for(const X of [b.min.x,b.max.x])for(const Y of [b.min.y,b.max.y])for(const Z of [b.min.z,b.max.z]){const v=new THREE.Vector3(X,Y,Z).project(camera);pts.push([(v.x+1)/2*st.width,(1-v.y)/2*st.height]);}
      const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);cx=(Math.min(...xs)+Math.max(...xs))/2;cy=(Math.min(...ys)+Math.max(...ys))/2;rx=(Math.max(...xs)-Math.min(...xs))/2;ry=(Math.max(...ys)-Math.min(...ys))/2;}}

  const g={};S.items.forEach(i=>{if(i.alive&&i.stress&&['animal','plant'].includes(CAT[i.type].kind))(g[i.stress]=g[i.stress]||[]).push(i);});

const b64u={enc:u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');},
  dec:t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),ch=>ch.charCodeAt(0))};
const zpipe=(u,T)=>new Response(new Blob([u]).stream().pipeThrough(new T('deflate-raw'))).arrayBuffer().then(b=>new Uint8Array(b));
async function packJar(){const o=snapshot();delete o.log;delete o.hist;o.real=false;return b64u.enc(await zpipe(new TextEncoder().encode(JSON.stringify(o)),CompressionStream));}
async function unpackJar(t){return JSON.parse(new TextDecoder().decode(await zpipe(b64u.dec(t),DecompressionStream)));}

  buildJar({keepChem:true});resetChem(S);
}
renderAll();resize();fitOverlays();checkShareLink();
let last=performance.now(),acc=0,lastUI=0,lastBal=0,lastSave=0,lastOv=0;
const editing=()=>{const a=document.activeElement;return a&&a.closest&&a.closest('#editor,#catBar,#pane-env,#pane-ana')&&['INPUT','SELECT'].includes(a.tagName);};
function frame(t){
  const dt=Math.min(.1,Math.max(0,(t-last)/1000));last=t;
  if(S.running){acc+=dt*S.speed;let n=0;while(acc>=1&&n<60){step(S);acc-=1;n++;}}
  animate(dt,S.hour+(S.running?acc:0));
  renderer.render(scene,camera);
  if(t-lastUI>250){lastUI=t;renderMeters();fitOverlays();
    if(dirtyList&&!editing()){renderJarList();updateCatCounts();if(S.sel&&!S.items.includes(S.sel)){S.sel=null;}renderOvR();}else updateJarLive();
    if(popIt)updatePop();
    if(ovOpen.L&&t-lastBal>2500&&!document.activeElement?.closest?.('#pane-bal')&&!($('#repBox')&&$('#repBox').matches(':hover'))){lastBal=t;renderBalance();}}
  if(t-lastOv>1000){lastOv=t;renderOvL();if(!dirtyList)renderOvR();if(issueOpen)renderIssuePop();}
  if(t-lastSave>15000){lastSave=t;save();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</html>
